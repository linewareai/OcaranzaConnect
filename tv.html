<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3b2a23"><title>Ocaranza TV</title><link rel="stylesheet" href="/static/app.css"></head><body class="tv-page"><div id="tv-app" class="tv-app"><div class="tv-fallback"><div class="tv-brand">HOTEL OCARANZA</div><div class="tv-title">Bienvenido a Santiago</div><div class="tv-sub">Cargando información del hotel…</div></div></div>
<script>
(function(){
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var root=document.getElementById('tv-app'); var xhr=new XMLHttpRequest(); xhr.open('GET','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true); xhr.timeout=7000;
xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status<200||xhr.status>=300)return;try{var d=JSON.parse(xhr.responseText);render(d);}catch(e){}};
xhr.ontimeout=function(){}; xhr.send(); setInterval(function(){var r=new XMLHttpRequest();r.open('GET','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true);r.onreadystatechange=function(){if(r.readyState!==4)return;if(r.status>=200&&r.status<300){try{render(JSON.parse(r.responseText));}catch(e){}}};r.send();},300000);
function render(d){var hotel=Array.isArray(d.hotel)?(d.hotel[0]||{}):(d.hotel||{}), ts=d.tours||[], ps=d.promotions||[];var tours='';for(var i=0;i<ts.length&&i<6;i++){var t=ts[i];tours+='<div class="tv-tour"><div><span class="tv-tour-name">'+h(t.name)+'</span><span class="tv-tour-desc">'+h(t.short_description||t.description)+'</span></div><strong>'+h(t.guest_price||t.normal_price)+'</strong></div>';}var promo='';if(ps.length)promo='<div class="tv-promo"><strong>'+h(ps[0].title)+'</strong><span>'+h(ps[0].text)+'</span></div>';
root.innerHTML='<div class="tv-screen"><header class="tv-header"><div><div class="tv-eyebrow">'+h(hotel.name)+'</div><h1>'+h(hotel.subtitle)+'</h1></div><div class="tv-time" id="tv-clock"></div></header><section class="tv-main"><div class="tv-welcome"><span>Bienvenido</span><h2>'+h(hotel.welcome_text)+'</h2><p>Consulta tours, servicios e información útil de tu estadía.</p><div class="tv-nav"><a href="/guest.html">🏨 Hotel</a><a href="/guest.html#tours">🚌 Tours</a><a href="/guest.html#hotel">🍳 Desayuno</a><a href="/guest.html#services">🛎 Servicios</a></div></div><aside class="tv-side">'+promo+'<h3>Tours destacados</h3>'+tours+'<div class="tv-qr"><div><strong>Continúa en tu teléfono</strong><span>Escanea el QR del televisor para ver todos los tours y servicios.</span></div></div></aside></section><footer class="tv-footer"><span>Desayuno '+h(hotel.breakfast_hours)+'</span><span>Check-out '+h(hotel.checkout)+'</span><span>'+h(hotel.address)+'</span></footer></div>';clock();}
function clock(){var el=document.getElementById('tv-clock');if(!el)return;function tick(){var d=new Date();el.innerHTML=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();}tick();setInterval(tick,30000);}
}());
</script></body></html>
