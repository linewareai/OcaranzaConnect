<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12221c"><title>Ocaranza TV</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="tv-page">
<div id="tv-app" class="tv-app"><div class="tv-fallback"><div class="tv-brand">OCARANZA</div><div class="tv-title">Bienvenido</div></div></div>
<script>
(function(){
var root=document.getElementById('tv-app'),x=new XMLHttpRequest();
x.open('GET','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true);x.timeout=8000;
x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status<200||x.status>=300)return;try{render(JSON.parse(x.responseText));}catch(e){}};
x.send();
setInterval(function(){var r=new XMLHttpRequest();r.open('GET','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true);r.onreadystatechange=function(){if(r.readyState!==4)return;if(r.status>=200&&r.status<300){try{render(JSON.parse(r.responseText));}catch(e){}}};r.send();},300000);
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(d){
 var hotel=Array.isArray(d.hotel)?(d.hotel[0]||{}):(d.hotel||{}),sections=d.sections||[],tours=d.tours||[],hero=hotel.hero_image_url||'';
 var cardDefs=[
  {i:'⌂',t:'Habitaciones',s:'Conoce nuestros espacios',href:'/guest.html#hotel'},
  {i:'☕',t:'Desayuno',s:hotel.breakfast_hours||'07:30 AM – 10:00 AM',href:'/guest.html#hotel'},
  {i:'⌖',t:'Tours y experiencias',s:'Descubre Santiago',href:'/guest.html#tours'},
  {i:'♧',t:'Servicios del hotel',s:'Todo lo que necesitas',href:'/guest.html#services'},
  {i:'?',t:'Preguntas frecuentes',s:'Resuelve tus dudas',href:'/guest.html#hotel'},
  {i:'☎',t:'Contacto',s:'Estamos para ayudarte',href:'/guest.html#services'}
 ];
 var cards='';
 for(var i=0;i<cardDefs.length;i++){var c=cardDefs[i];cards+='<a class="tv-card" href="'+c.href+'"><span class="tv-card-icon">'+c.i+'</span><strong>'+c.t+'</strong><small>'+c.s+'</small><span class="tv-card-arrow">↗</span></a>';}
 var tourStrip='';
 for(i=0;i<tours.length&&i<3;i++){var t=tours[i];tourStrip+='<div class="tv-tour-mini"><span>'+h(t.name)+'</span><strong>'+h(t.guest_price||t.normal_price||'Consultar')+'</strong></div>';}
 root.innerHTML=
 '<div class="tv-screen">'+
   '<div class="tv-hero-image" style="background-image:url(\''+h(hero).replace(/'/g,"%27")+'\')"></div><div class="tv-hero-shade"></div>'+
   '<header class="tv-header"><div class="tv-brand-mark"><div class="h">H</div><div class="name">OCARANZA</div></div><div class="tv-header-right"><span class="lang">🇨🇱 ES</span><span class="clock" id="tv-clock"></span></div></header>'+
   '<main class="tv-content"><div class="tv-hero-copy"><span class="kicker">BIENVENIDO/A</span><h1>Disfruta tu estadía<br><em>en Hotel Ocaranza</em></h1><p>'+h(hotel.welcome_text||'Encuentra toda la información que necesitas para disfrutar Santiago.')+'</p></div><div class="tv-quick">'+cards+'</div></main>'+
   '<footer class="tv-footer"><span>Desayuno '+h(hotel.breakfast_hours||'07:30 AM – 10:00 AM')+'</span>'+tourStrip+'<span>'+h(hotel.address||'Santiago, Chile')+'</span></footer>'+
 '</div>';
 clock();
}
function clock(){var el=document.getElementById('tv-clock');if(!el)return;function tick(){var d=new Date(),hh=d.getHours(),mm=d.getMinutes();el.innerHTML=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;}tick();setInterval(tick,30000);}
}());
</script>
</body>
</html>
