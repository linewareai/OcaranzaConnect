<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3b2a23"><title>Tour | Hotel Ocaranza</title><link rel="stylesheet" href="/static/app.css"></head><body class=""><div id="tour-app" class="guest-app"><div class="loading">Cargando experiencia…</div></div>
<script>
(function(){
var q=new URLSearchParams(location.search),slug=q.get('slug')||'',source=q.get('source')||'',root=document.getElementById('tour-app');
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function track(type,id){var x=new XMLHttpRequest();x.open('POST','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({event_type:type,source:source,path:location.pathname,tour_id:id||null}));}
var x=new XMLHttpRequest();x.open('GET','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status<200||x.status>=300){root.innerHTML='<div class="error-state"><h1>No disponible</h1></div>';return;}var d=JSON.parse(x.responseText),hotel=Array.isArray(d.hotel)?(d.hotel[0]||{}):(d.hotel||{}),ts=d.tours||[],t=null;for(var i=0;i<ts.length;i++)if(ts[i].slug===slug)t=ts[i];if(!t){root.innerHTML='<div class="error-state"><h1>Tour no encontrado</h1><a href="/guest.html">Volver</a></div>';return;}track('tour_view',t.id);var wa=(hotel.whatsapp||'').replace(/[^0-9]/g,'');var msg=encodeURIComponent('Hola, estoy alojado en '+hotel.name+' y quiero consultar por el tour '+t.name+'.');var contact=wa?'https://wa.me/'+wa+'?text='+msg:'#';root.innerHTML='<div class="tour-detail"><a class="back-link" href="/guest.html?source='+encodeURIComponent(source)+'">← Volver</a>'+(t.image_url?'<img class="detail-image" src="'+h(t.image_url)+'" alt="">':'<div class="detail-placeholder">'+h(t.name)+'</div>')+'<div class="detail-card">'+(t.featured?'<span class="badge">Recomendado</span>':'')+'<h1>'+h(t.name)+'</h1><p class="lead">'+h(t.description||t.short_description)+'</p><div class="price-box"><span>Precio huésped</span><strong>'+h(t.guest_price||t.normal_price)+'</strong><small>'+h(t.discount)+'</small></div><div class="detail-grid"><div><strong>Duración</strong><span>'+h(t.duration)+'</span></div><div><strong>Horario</strong><span>'+h(t.schedule)+'</span></div><div><strong>Días</strong><span>'+h(t.days_available)+'</span></div><div><strong>Encuentro</strong><span>'+h(t.meeting_point)+'</span></div></div><h2>Incluye</h2><p>'+h(t.includes)+'</p><h2>No incluye</h2><p>'+h(t.excludes)+'</p><h2>Reserva</h2><p>'+h(t.booking_instructions)+'</p><a class="primary-btn wide" href="'+h(contact)+'" onclick="track(\'contact_click\','+t.id+')">'+h(t.contact_text||'Consultar por WhatsApp')+'</a></div></div>';};x.send();
}());
</script></body></html>
