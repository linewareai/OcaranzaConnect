<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3ec"><title>Hotel Ocaranza</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="portal-page">
<div id="app" class="guest-app">
  <div class="splash-loading" aria-label="Hotel Ocaranza"><div class="oc-logo oc-logo-splash"><span class="oc-logo-h">H</span><span class="oc-logo-word">OCARANZA</span></div></div>
</div>
<script>
(function(){
  var params=new URLSearchParams(window.location.search);
  var source=params.get('source')||'';
  var view=params.get('view')||'home';
  var app=document.getElementById('app');
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    if(xhr.status<200||xhr.status>=300){
      app.innerHTML='<div class="error-state"><div class="oc-logo oc-logo-error"><span class="oc-logo-h">H</span><span class="oc-logo-word">OCARANZA</span></div><h1>No pudimos cargar la información</h1><p>Inténtalo nuevamente.</p><button onclick="location.reload()">Reintentar</button></div>';
      return;
    }
    try{render(JSON.parse(xhr.responseText));}
    catch(e){app.innerHTML='<div class="error-state"><div class="oc-logo oc-logo-error"><span class="oc-logo-h">H</span><span class="oc-logo-word">OCARANZA</span></div><h1>Error de carga</h1><p>Inténtalo nuevamente.</p><button onclick="location.reload()">Reintentar</button></div>';}
  };
  xhr.send();

  function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function track(type,tour){
    var x=new XMLHttpRequest();
    x.open('POST','https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-public',true);
    x.setRequestHeader('Content-Type','application/json');
    x.send(JSON.stringify({event_type:type,source:source,path:location.pathname+location.search,tour_id:tour||null}));
  }
  function go(v){
    var url='/?view='+encodeURIComponent(v)+(source?'&source='+encodeURIComponent(source):'');
    history.pushState({view:v},'',url);
    view=v;
    window.scrollTo(0,0);
    render(window.__ocar_data);
  }
  window.onpopstate=function(){params=new URLSearchParams(window.location.search);view=params.get('view')||'home';render(window.__ocar_data);};

  function icon(kind){
    var s='<svg viewBox="0 0 48 48" aria-hidden="true">';
    if(kind==='hotel')s+='<path d="M9 40V9h30v31M15 15h6v6h-6zM27 15h6v6h-6zM15 27h6v6h-6zM27 27h6v6h-6z"/>';
    else if(kind==='cup')s+='<path d="M8 17h25v10c0 7-5 11-13 11S8 34 8 27zM33 20h4c4 0 6 2 6 6s-2 6-6 6h-4M12 42h22"/><path d="M16 9v5M23 7v7M30 9v5"/>';
    else if(kind==='pin')s+='<path d="M24 43s13-11 13-23a13 13 0 1 0-26 0c0 12 13 23 13 23z"/><circle cx="24" cy="20" r="4"/>';
    else if(kind==='bell')s+='<path d="M12 35h24M15 35V22a9 9 0 0 1 18 0v13M18 41h12M24 11V7"/>';
    else if(kind==='city')s+='<path d="M8 40V21h10v19M18 40V10h12v30M30 40V17h10v23M5 40h38"/>';
    else s+='<circle cx="24" cy="24" r="17"/><path d="M16 20a8 8 0 0 1 16 0c0 7-8 6-8 12M24 36h.01"/>';
    return s+'</svg>';
  }
  function nav(current){
    var items=[
      ['home','Inicio','home'],['hotel','Hotel','hotel'],['breakfast','Desayuno','cup'],
      ['tours','Tours','pin'],['services','Servicios','bell'],['contact','Contacto','help']
    ];
    var out='<nav class="app-nav">';
    for(var i=0;i<items.length;i++){
      var it=items[i],active=current===it[0]?' is-active':'';
      out+='<button class="app-nav-item'+active+'" data-view="'+it[0]+'"><span>'+icon(it[2])+'</span><small>'+it[1]+'</small></button>';
    }
    return out+'</nav>';
  }
  function header(hotel,current){
    return '<header class="app-header"><button class="app-brand" data-view="home" aria-label="Inicio"><span class="oc-logo oc-logo-header"><span class="oc-logo-h">H</span><span class="oc-logo-word">OCARANZA</span></span></button><span class="app-header-title">'+h(current==='home'?'Tu estadía':label(current))+'</span></header>';
  }
  function label(v){return ({hotel:'Hotel',breakfast:'Desayuno',tours:'Tours',services:'Servicios y pedidos',contact:'Contacto'})[v]||'Tu estadía';}
  function card(v,kind,title,desc){
    return '<button class="app-module-card" data-view="'+v+'"><span class="module-icon">'+icon(kind)+'</span><span class="module-copy"><strong>'+title+'</strong><small>'+desc+'</small></span><span class="module-arrow">›</span></button>';
  }
  function render(d){
    window.__ocar_data=d;
    track('visit');if(source)track('qr_scan');
    var hotel=Array.isArray(d.hotel)?(d.hotel[0]||{}):(d.hotel||{});
    var tours=d.tours||[],sections=d.sections||[],promos=d.promotions||[];
    var section=function(slug){for(var i=0;i<sections.length;i++)if(sections[i].slug===slug)return sections[i];return null;};
    var services=section('services'),santiago=section('santiago');
    var html=header(hotel,view);

    if(view==='home'){
      html+='<main class="app-home"><section class="app-welcome"><div class="app-welcome-photo" style="background-image:url(\'/static/images/fondo1.jpg\')"></div><div class="app-welcome-shade"></div><div class="app-welcome-content"><span class="eyebrow">BIENVENIDO/A</span><h1>¿Qué necesitas<br><em>durante tu estadía?</em></h1><p>Todo Ocaranza, en seis accesos rápidos.</p></div></section><section class="module-section"><div class="module-grid">'+
      card('hotel','hotel','Información del hotel','Habitaciones, horarios y datos útiles')+
      card('breakfast','cup','Desayuno','Horarios y detalles del servicio')+
      card('tours','pin','Tours y experiencias','Descubre Santiago y sus alrededores')+
      card('services','bell','Servicios y pedidos','Solicita ayuda o consulta productos')+
      card('contact','help','Contacto','Habla con recepción')+
      card('santiago','city','Santiago','Qué hacer y qué visitar')+
      '</div></section></main>';
    }else if(view==='hotel'){
      html+='<main class="app-module"><span class="eyebrow dark">HOTEL</span><h1>Información útil</h1><p class="module-lead">'+h(hotel.welcome_text||'Todo lo que necesitas saber para disfrutar tu estadía.')+'</p><div class="detail-grid">'+
      '<div class="detail-card"><span>Desayuno</span><strong>'+h(hotel.breakfast_hours||'07:30 - 10:00')+'</strong></div>'+
      '<div class="detail-card"><span>Check-in</span><strong>'+h(hotel.checkin||'15:00')+'</strong></div>'+
      '<div class="detail-card"><span>Check-out</span><strong>'+h(hotel.checkout||'12:00')+'</strong></div>'+
      '<div class="detail-card"><span>Dirección</span><strong>'+h(hotel.address||'Santiago, Chile')+'</strong></div>'+
      '</div></main>';
    }else if(view==='breakfast'){
      html+='<main class="app-module"><span class="eyebrow dark">SERVICIO</span><h1>Desayuno</h1><div class="feature-module"><span class="module-icon">'+icon('cup')+'</span><h2>'+h(hotel.breakfast_hours||'07:30 - 10:00')+'</h2><p>'+h(hotel.breakfast_description||'Disfruta nuestro servicio de desayuno.')+'</p></div><div class="module-note">Consulta en recepción por cualquier requerimiento especial.</div></main>';
    }else if(view==='tours'){
      var tourHtml='';
      for(var i=0;i<tours.length;i++){var t=tours[i];tourHtml+='<article class="compact-tour">'+(t.image_url?'<img src="'+h(t.image_url)+'" alt="">':'')+'<div><span class="eyebrow dark">EXPERIENCIA</span><h2>'+h(t.name)+'</h2><p>'+h(t.short_description||t.description||'Descubre esta experiencia.')+'</p><strong>'+h(t.guest_price||t.normal_price||'Consultar')+'</strong></div></article>';}
      html+='<main class="app-module"><span class="eyebrow dark">EXPERIENCIAS</span><h1>Tours y experiencias</h1><div class="compact-tour-grid">'+tourHtml+'</div></main>';
    }else if(view==='services'){
      html+='<main class="app-module"><span class="eyebrow dark">ATENCIÓN</span><h1>Servicios y pedidos</h1><p class="module-lead">Estamos para ayudarte durante toda tu estadía.</p><div class="service-actions">'+
      '<button class="service-action" data-view="contact"><span>'+icon('bell')+'</span><strong>Solicitar ayuda</strong><small>Contactar recepción</small></button>'+
      '<div class="service-action"><span>'+icon('hotel')+'</span><strong>Productos</strong><small>Próximamente podrás consultar productos y hacer pedidos desde aquí.</small></div>'+
      '</div>'+(services?'<div class="module-note">'+h(services.content)+'</div>':'')+'</main>';
    }else if(view==='santiago'){
      html+='<main class="app-module"><span class="eyebrow dark">ALREDEDORES</span><h1>Santiago</h1><div class="text-panel app-text">'+h(santiago?santiago.content:'Descubre Santiago desde Hotel Ocaranza.')+'</div><button class="wide-action" data-view="tours">Ver experiencias ↗</button></main>';
    }else{
      var whatsapp=(hotel.whatsapp||'').replace(/[^0-9]/g,'');
      var wa=whatsapp?'https://wa.me/'+whatsapp+'?text='+encodeURIComponent('Hola, soy huésped de '+hotel.name+'. Quisiera consultar por un servicio.'):'#';
      html+='<main class="app-module contact-module"><span class="eyebrow dark">RECEPCIÓN</span><h1>¿Necesitas ayuda?</h1><p class="module-lead">Estamos disponibles para ayudarte durante tu estadía.</p><a class="contact-main" href="'+h(wa)+'">Contactar por WhatsApp ↗</a><div class="contact-data"><div><span>Teléfono</span><strong>'+h(hotel.phone||'Consultar en recepción')+'</strong></div><div><span>Dirección</span><strong>'+h(hotel.address||'Santiago, Chile')+'</strong></div></div></main>';
    }
    html+=nav(view);
    app.innerHTML=html;
    bind();
  }
  function bind(){
    var els=document.querySelectorAll('[data-view]');
    for(var i=0;i<els.length;i++)els[i].addEventListener('click',function(){go(this.getAttribute('data-view'));});
  }
}());
</script>
</body></html>
