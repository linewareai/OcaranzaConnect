<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>OcaranzaConnect · Administración</title>
<link rel="stylesheet" href="/static/app.css">
<style>
:root{--adm-black:#090908;--adm-ink:#18271f;--adm-gold:#c7a15a;--adm-gold-2:#e2c47e;--adm-paper:#f5f1e8;--adm-card:#fffdfa;--adm-line:#e2dbcf;--adm-muted:#7d786f;--adm-green:#2f604b;--adm-red:#9a443b}
*{box-sizing:border-box}body.admin-page{margin:0;background:linear-gradient(180deg,#f3eee5 0,#faf8f3 36%,#f5f1e8 100%);color:var(--adm-ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.admin-shell{max-width:1380px;margin:auto;padding:24px 22px 70px}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.admin-brand{display:flex;align-items:center;gap:14px}.admin-brand .oc-logo-h{font-size:40px}.admin-brand .oc-logo-word{font-size:6px}.admin-title small{display:block;color:#918a7e;font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:5px}.admin-title h1{margin:0;font:500 22px Georgia,"Times New Roman",serif;letter-spacing:-.02em}.admin-actions{display:flex;gap:8px}
.adm-btn{border:1px solid var(--adm-gold);background:var(--adm-black);color:var(--adm-gold-2);border-radius:12px;padding:10px 13px;font-size:11px;font-weight:800;cursor:pointer;transition:.2s}.adm-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px #0002}.adm-btn.light{background:#fffdfa;color:var(--adm-ink);border-color:#d8cfbf}.adm-btn.danger{background:#fff4f1;color:var(--adm-red);border-color:#d9aaa3}.adm-btn.success{background:#eef7f1;color:#315e47;border-color:#b9d5c2}
.admin-tabs{display:flex;gap:7px;overflow:auto;padding:7px;background:#0a0a09;border:1px solid #b89a61;border-radius:18px;box-shadow:0 12px 30px #0002;margin-bottom:20px}.admin-tab{flex:0 0 auto;border:1px solid transparent;background:transparent;color:#bcb7ae;border-radius:12px;padding:11px 14px;font-size:11px;font-weight:800;cursor:pointer}.admin-tab span{display:block;font-size:8px;color:#827d74;font-weight:600;margin-top:3px}.admin-tab.active{background:linear-gradient(145deg,#d4b36f,#b89450);color:#10100d;box-shadow:0 6px 18px #0003}.admin-tab.active span{color:#4c3a1d}
.admin-view{display:none}.admin-view.active{display:block}.section-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin:0 0 14px}.section-intro h2{margin:0;font:500 27px Georgia,"Times New Roman",serif;letter-spacing:-.03em}.section-intro p{margin:5px 0 0;color:var(--adm-muted);font-size:11px;line-height:1.5}.section-kicker{color:#9a7a3e;font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:17px}.metric{position:relative;overflow:hidden;background:var(--adm-black);color:white;border:1px solid #b4965d;border-radius:18px;padding:17px}.metric:after{content:"";position:absolute;width:90px;height:90px;border:1px solid #c8a55e33;border-radius:50%;right:-30px;bottom:-40px}.metric small{display:block;color:#aaa59c;font-size:8px;text-transform:uppercase;letter-spacing:.13em}.metric strong{display:block;color:#e3c57f;font-size:26px;margin-top:7px}.metric em{display:block;color:#8e8981;font-size:9px;font-style:normal;margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.adm-card{background:rgba(255,253,249,.95);border:1px solid var(--adm-line);border-radius:21px;padding:20px;box-shadow:0 13px 35px #26352c0b;position:relative;overflow:hidden}.adm-card:before{content:"";position:absolute;top:0;left:22px;width:62px;height:2px;background:var(--adm-gold)}.adm-card h3{margin:0 0 5px;font-size:16px}.adm-card p{margin:0;color:var(--adm-muted);font-size:10px;line-height:1.5}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#676158}.field input,.field select,.field textarea{width:100%;border:1px solid #d8d0c3;border-radius:11px;background:#fcfaf6;color:#181815;padding:11px 12px;font:inherit;font-size:12px;outline:0}.field textarea{min-height:74px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#bd9956;box-shadow:0 0 0 3px #bd99561a}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}.form-message{margin-top:10px;padding:9px 11px;border-radius:10px;font-size:10px}.form-message.ok{background:#e9f3ec;color:#315e47}.form-message.err{background:#f8e9e6;color:#8d3e36}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar-actions{display:flex;gap:7px;flex-wrap:wrap}.search{border:1px solid #d8d0c3;background:#fffdfa;border-radius:11px;padding:10px 12px;font-size:11px;min-width:210px;outline:0}.search:focus{border-color:#bd9956}
.room-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.room-card{background:#fffdfa;border:1px solid #ddd5c8;border-radius:17px;padding:15px;min-height:148px;position:relative;cursor:pointer;transition:.2s}.room-card:hover{transform:translateY(-2px);border-color:#c4a261;box-shadow:0 12px 24px #26352c0d}.room-card.occupied{background:linear-gradient(145deg,#fffaf0,#f5ead6);border-color:#c9aa6c}.room-card.maintenance{background:#f1efeb;border-color:#aaa49b}.room-number{font:600 20px Georgia,serif}.room-floor{display:block;color:#9b958c;font-size:8px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}.room-status{display:inline-flex;margin-top:12px;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:900;text-transform:uppercase;background:#e8f1ea;color:#3c624a}.room-card.occupied .room-status{background:#0a0a09;color:#e0bf79}.room-card.maintenance .room-status{background:#e5e2dc;color:#69635b}.room-cap{position:absolute;right:13px;top:14px;font-size:9px;color:#777}.room-guests{margin-top:11px;padding-top:10px;border-top:1px solid #ded6c8;font-size:10px;color:#5f5b55}.room-guests strong{color:#806536}
.table-wrap{overflow:auto;border:1px solid var(--adm-line);border-radius:16px;background:#fffdfa}.adm-table{width:100%;border-collapse:collapse;min-width:850px}.adm-table th{text-align:left;padding:12px 13px;background:#f6f1e8;color:#8b8479;font-size:8px;text-transform:uppercase;letter-spacing:.11em}.adm-table td{padding:13px;border-top:1px solid #ebe4d9;font-size:11px;vertical-align:middle}.person strong{display:block;font-size:12px}.person small{display:block;color:#89837b;margin-top:3px;font-size:9px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:900;text-transform:uppercase;background:#e9f1eb;color:#3a634a}.pill.gold{background:#f3ead7;color:#806536}.pill.red{background:#f7e8e5;color:#8d4038}.pill.gray{background:#ece9e4;color:#6d675e}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid #d3cabd;background:#fffdfa;color:#4d4942;border-radius:8px;padding:6px 8px;font-size:8px;font-weight:900;cursor:pointer}.mini.gold{background:#f3ead7;border-color:#d2b06b;color:#745b2d}.mini.red{background:#fff3f0;border-color:#d9aaa3;color:#914139}
.order-list{display:flex;flex-direction:column}.order-item{display:grid;grid-template-columns:1.25fr .7fr .55fr .65fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #e9e1d6}.order-item:last-child{border-bottom:0}.order-item strong{font-size:12px}.order-item small{display:block;color:#878178;font-size:9px;margin-top:4px}.order-total{font-weight:900;color:#806536}.status-select{border:1px solid #d5ccbe;border-radius:9px;background:#fffdfa;padding:7px;font-size:9px}
.date-bar{display:flex;align-items:end;gap:9px;flex-wrap:wrap}.date-field{display:flex;flex-direction:column;gap:5px}.date-field label{font-size:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:#777068}.date-field input{border:1px solid #d8d0c3;border-radius:10px;padding:9px 10px;background:#fffdfa;font-size:11px}.finance-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.finance-kpi{border:1px solid #ddd4c5;border-radius:15px;background:#fffdfa;padding:13px}.finance-kpi small{display:block;color:#8d867c;font-size:8px;text-transform:uppercase;letter-spacing:.1em}.finance-kpi strong{display:block;font-size:18px;margin-top:6px}.finance-kpi.gold{background:#f4ead6;border-color:#d2b16d}.finance-kpi.gold strong{color:#806536}.finance-table{width:100%;border-collapse:collapse}.finance-table th,.finance-table td{padding:11px 12px;border-bottom:1px solid #e9e2d7;text-align:left;font-size:10px}.finance-table th{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#8b8479}.bar{height:8px;background:#eee8dd;border-radius:99px;overflow:hidden;min-width:120px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8924e,#e1c37c);border-radius:99px}
.empty-state{text-align:center;padding:35px 15px;color:#898279;font-size:11px}.empty-state strong{display:block;color:#4b4841;font-size:14px;margin-bottom:5px}.notice{padding:11px 13px;border-left:2px solid var(--adm-gold);background:#f5efe4;color:#6f685e;font-size:10px;line-height:1.5;border-radius:0 10px 10px 0}.muted{color:#888;font-size:10px}.login-card{max-width:470px;margin:90px auto}.login-card .adm-logo{text-align:center;margin-bottom:17px}.login-card .adm-logo .oc-logo-h{font-size:50px}.login-card .adm-logo .oc-logo-word{font-size:7px}
.modal{position:fixed;inset:0;background:#05050499;backdrop-filter:blur(7px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fffdfa;border:1px solid #c9a65f;border-radius:24px;padding:23px;box-shadow:0 30px 80px #0005}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:17px}.modal-head h2{margin:0;font:500 24px Georgia,serif}.close{border:1px solid #d7cebf;background:#f8f4ec;border-radius:10px;padding:8px 10px;cursor:pointer}
@media(max-width:1050px){.room-grid{grid-template-columns:repeat(4,1fr)}.metric-grid{grid-template-columns:repeat(2,1fr)}.finance-summary{grid-template-columns:repeat(3,1fr)}.order-item{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:720px){.admin-shell{padding:15px 11px 50px}.admin-top{align-items:flex-start}.admin-brand{gap:8px}.admin-title h1{font-size:18px}.admin-title small{font-size:8px}.admin-actions .adm-btn:first-child{display:none}.admin-tabs{border-radius:15px;margin:0 -1px 15px}.admin-tab{padding:10px 11px;font-size:9px}.admin-tab span{display:none}.metric-grid{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px}.metric strong{font-size:22px}.grid-2,.grid-3{grid-template-columns:1fr}.room-grid{grid-template-columns:repeat(2,1fr)}.section-intro{display:block}.section-intro h2{font-size:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.finance-summary{grid-template-columns:1fr 1fr}.order-item{grid-template-columns:1fr 1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.login-card{margin:45px auto}.admin-top{margin-bottom:12px}}
</style>
</head>
<body class="admin-page">
<div id="admin-app"></div>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><div><span id="modal-kicker" class="section-kicker">Gestión</span><h2 id="modal-title">Editar</h2></div><button class="close" id="modal-close">Cerrar</button></div><div id="modal-body"></div></div></div>
<script>
(function(){
var API='https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-auth',app=document.getElementById('admin-app'),state={tab:'overview',guests:[],rooms:[],orders:[],finance:null};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function token(){try{return localStorage.getItem('oc_admin_token')||''}catch(e){return''}}
function save(t){try{localStorage.setItem('oc_admin_token',t)}catch(e){}}
function clear(){try{localStorage.removeItem('oc_admin_token')}catch(e){}}
function req(path,body,done){
 var x=new XMLHttpRequest();x.open('POST',API+'/'+path,true);x.setRequestHeader('Content-Type','application/json');if(token())x.setRequestHeader('Authorization','Bearer '+token());
 x.onreadystatechange=function(){if(x.readyState!==4)return;var d={};try{d=JSON.parse(x.responseText||'{}')}catch(e){d={error:'Respuesta inválida del servidor.'}}done(x.status,d)};x.onerror=function(){done(0,{error:'No se pudo conectar con OcaranzaConnect.'})};x.send(JSON.stringify(body||{}));
}
function health(done){var x=new XMLHttpRequest();x.open('GET',API+'/health',true);x.onreadystatechange=function(){if(x.readyState!==4)return;var d={};try{d=JSON.parse(x.responseText||'{}')}catch(e){}done(x.status,d)};x.send()}
function money(n){return '$'+Number(n||0).toLocaleString('es-CL')}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Santiago'})}
function notify(el,msg,ok){if(!el)return;el.className='form-message '+(ok?'ok':'err');el.textContent=msg}
function openModal(title,body,kicker){document.getElementById('modal-title').textContent=title;document.getElementById('modal-kicker').textContent=kicker||'Gestión';document.getElementById('modal-body').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modal-body').innerHTML=''}
document.getElementById('modal-close').onclick=closeModal;document.getElementById('modal').onclick=function(e){if(e.target===this)closeModal()}
function loginView(first){
 app.innerHTML='<div class="admin-shell"><div class="adm-card login-card"><div class="adm-logo"><span class="oc-logo"><span class="oc-logo-h">H</span><span class="oc-logo-word">OCARANZA</span></span></div><div class="section-kicker">'+(first?'Primer acceso':'Gestión interna')+'</div><h2 style="font:500 27px Georgia,serif;margin:7px 0">'+(first?'Activar administrador':'Acceso de recepción')+'</h2><p style="color:#777;font-size:11px;line-height:1.5;margin:0 0 18px">'+(first?'Crea el acceso maestro para administrar huéspedes, habitaciones, pedidos y movimientos.':'Ingresa con el usuario de recepción para continuar.')+'</p><form id="auth-form"><div class="field"><label>Usuario</label><input name="username" value="Admin" readonly></div><div class="field" style="margin-top:11px"><label>Contraseña</label><input name="password" type="password" minlength="8" required placeholder="Contraseña administrativa"></div><button class="adm-btn" style="width:100%;margin-top:15px">'+(first?'Activar administrador':'Ingresar')+'</button><div id="auth-msg"></div></form></div></div>';
 document.getElementById('auth-form').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button'),m=document.getElementById('auth-msg');b.disabled=true;req(first?'signup':'login',{email:'admin@ocaranzaconnect.app',username:'Admin',password:f.password.value},function(s,d){if(s>=200&&s<300&&d.session){save(d.session.access_token);loadAll()}else if(first&&s>=200&&s<300&&d.needsLogin){b.disabled=false;notify(m,d.warning||'Administrador creado. Ahora inicia sesión.',true);setTimeout(function(){loginView(false)},900)}else{b.disabled=false;notify(m,d.error||'No se pudo completar el acceso.',false)}})}
}
function shell(){
 app.innerHTML='<div class="admin-shell"><header class="admin-top"><div class="admin-brand"><span class="oc-logo"><span class="oc-logo-h">H</span><span class="oc-logo-word">OCARANZA</span></span><div class="admin-title"><small>Recepción · OcaranzaConnect</small><h1>Centro de administración</h1></div></div><div class="admin-actions"><button class="adm-btn light" id="refresh">Actualizar</button><button class="adm-btn" id="logout">Cerrar sesión</button></div></header><nav class="admin-tabs"><button class="admin-tab" data-tab="overview">⌂<span>Resumen</span></button><button class="admin-tab" data-tab="rooms">▦<span>Habitaciones</span></button><button class="admin-tab" data-tab="guests">♙<span>Huéspedes</span></button><button class="admin-tab" data-tab="orders">♧<span>Pedidos</span></button><button class="admin-tab" data-tab="finance">◷<span>Movimientos</span></button></nav><main id="views"></main></div>';
 document.getElementById('logout').onclick=function(){clear();render()};document.getElementById('refresh').onclick=loadAll;
 document.querySelectorAll('.admin-tab').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;renderViews()}})
}
function renderViews(){
 document.querySelectorAll('.admin-tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)});
 var v=document.getElementById('views');if(!v)return;
 if(state.tab==='overview')v.innerHTML=overviewView();else if(state.tab==='rooms')v.innerHTML=roomsView();else if(state.tab==='guests')v.innerHTML=guestsView();else if(state.tab==='orders')v.innerHTML=ordersView();else v.innerHTML=financeView();
 bindView();
}
function overviewView(){
 var occ=state.rooms.filter(function(r){return r.occupied}).length,active=state.guests.filter(function(g){return g.status==='active'}).length,pending=state.orders.filter(function(o){return o.status==='pending'}).length;
 return '<section class="section-intro"><div><span class="section-kicker">Recepción</span><h2>Buenos días, Admin</h2><p>Una vista rápida de lo que está ocurriendo en el hotel.</p></div><button class="adm-btn" id="quick-guest">+ Registrar huésped</button></section><div class="metric-grid"><div class="metric"><small>Habitaciones ocupadas</small><strong>'+occ+' / '+state.rooms.length+'</strong><em>Disponibilidad actual</em></div><div class="metric"><small>Huéspedes activos</small><strong>'+active+'</strong><em>Personas alojadas</em></div><div class="metric"><small>Pedidos pendientes</small><strong>'+pending+'</strong><em>Requieren atención</em></div><div class="metric"><small>Venta confirmada hoy</small><strong>'+money(state.finance?.summary?.confirmed||0)+'</strong><em>'+today()+'</em></div></div><div class="grid-2"><div class="adm-card"><h3>Estado de habitaciones</h3><p style="margin-bottom:15px">Capacidad y ocupación en una sola mirada.</p><div class="room-grid" style="grid-template-columns:repeat(2,1fr)">'+state.rooms.map(roomMini).join('')+'</div></div><div class="adm-card"><h3>Actividad reciente</h3><p style="margin-bottom:8px">Últimos movimientos registrados.</p>'+recentActivity()+'</div></div>';
}
function roomMini(r){
 return '<div class="room-card '+(r.occupied?'occupied ':'')+(r.status==='maintenance'?'maintenance':'')+'" data-room="'+esc(r.room_number)+'"><span class="room-number">'+esc(r.room_number)+'</span><span class="room-cap">'+Number(r.guest_count||0)+' / '+Number(r.max_occupancy||2)+'</span><span class="room-floor">Piso '+esc(r.floor)+'</span><span class="room-status">'+(r.status==='maintenance'?'Mantención':r.occupied?'Ocupada':'Disponible')+'</span><div class="room-guests">'+(r.guest_count?'<strong>'+r.guest_count+' huésped'+(r.guest_count>1?'es':'')+'</strong>':'Sin huéspedes')+'</div></div>'
}
function recentActivity(){
 if(!state.orders.length)return '<div class="empty-state"><strong>Sin actividad todavía</strong>Los pedidos aparecerán aquí cuando los huéspedes comiencen a utilizar el portal.</div>';
 return state.orders.slice(0,7).map(function(o){var g=o.oc_guest_profiles||{};return '<div style="display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee6da"><div><strong style="font-size:11px">'+esc(o.item_name)+'</strong><small style="display:block;color:#888;font-size:9px;margin-top:3px">'+esc(g.display_name||'Huésped')+' · Hab. '+esc(g.room_number||'')+'</small></div><strong style="color:#806536;font-size:10px">'+money(o.total)+'</strong></div>'}).join('')
}
function roomsView(){
 return '<section class="section-intro"><div><span class="section-kicker">Inventario físico</span><h2>Habitaciones</h2><p>Define capacidad, estado y revisa cuántas personas hay actualmente en cada habitación.</p></div></section><div class="notice" style="margin-bottom:13px">La capacidad se valida automáticamente al registrar huéspedes. Cada perfil activo cuenta como una persona alojada.</div><div class="room-grid">'+state.rooms.map(roomMini).join('')+'</div>';
}
function guestsView(){
 return '<section class="section-intro"><div><span class="section-kicker">Registro</span><h2>Huéspedes</h2><p>Edita perfiles, gestiona accesos, habitaciones y estadías. El historial financiero se conserva al dar de baja un acceso.</p></div><button class="adm-btn" id="new-guest">+ Nuevo huésped</button></section><div class="toolbar"><input class="search" id="guest-search" placeholder="Buscar por nombre, usuario o habitación"><span class="muted">'+state.guests.length+' registros</span></div><div class="adm-card" style="padding:0"><div class="table-wrap" style="border:0"><table class="adm-table"><thead><tr><th>Huésped</th><th>Habitación</th><th>Estadía</th><th>Beneficio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="guest-rows">'+guestRows(state.guests)+'</tbody></table></div></div>';
}
function guestRows(rows){
 if(!rows.length)return '<tr><td colspan="6"><div class="empty-state"><strong>No hay huéspedes registrados</strong>Registra el primer huésped desde este panel.</div></td></tr>';
 return rows.map(function(g){var status=g.status||'active';return '<tr data-guest-row data-search="'+esc((g.display_name+' '+g.username+' '+g.room_number).toLowerCase())+'"><td class="person"><strong>'+esc(g.display_name)+'</strong><small>@'+esc(g.username)+(g.phone?' · '+esc(g.phone):'')+'</small></td><td><strong>'+esc(g.room_number)+'</strong></td><td><span class="muted">'+esc(g.check_in||'Sin fecha')+' → '+esc(g.check_out||'Sin fecha')+'</span></td><td><span class="pill gold">'+Number(g.discount_percent||10)+'% OFF</span></td><td><span class="pill '+(status==='active'?'':status==='checked_out'?'gray':'red')+'">'+(status==='active'?'Activo':status==='checked_out'?'Baja':'Bloqueado')+'</span></td><td><div class="row-actions"><button class="mini gold edit-guest" data-id="'+esc(g.id)+'">Editar</button><button class="mini pass-guest" data-id="'+esc(g.id)+'">Clave</button><button class="mini red delete-guest" data-id="'+esc(g.id)+'">Dar de baja</button></div></td></tr>'}).join('')
}
function ordersView(){
 return '<section class="section-intro"><div><span class="section-kicker">Operación</span><h2>Pedidos</h2><p>Aquí se gestionan los pedidos, separados del registro de huéspedes.</p></div></section><div class="adm-card"><div class="toolbar"><div><strong>'+state.orders.length+' pedidos</strong><div class="muted">Actualiza el estado directamente desde esta pantalla.</div></div><button class="adm-btn light" id="orders-refresh">Actualizar</button></div><div class="order-list">'+(state.orders.length?state.orders.map(orderRow).join(''):'<div class="empty-state"><strong>No hay pedidos</strong>Cuando un huésped solicite algo aparecerá aquí.</div>')+'</div></div>';
}
function orderRow(o){
 var g=o.oc_guest_profiles||{};return '<div class="order-item"><div><strong>'+esc(o.item_name)+'</strong><small>'+esc(g.display_name||'Huésped')+' · Hab. '+esc(g.room_number||'')+' · '+new Date(o.created_at).toLocaleString('es-CL')+'</small></div><div><small>'+esc(o.source||'hotel')+'</small><b>'+Number(o.quantity||0)+' × '+money(o.unit_price)+'</b></div><div class="order-total">'+money(o.total)+'</div><select class="status-select order-status" data-id="'+esc(o.id)+'"><option '+(o.status==='pending'?'selected':'')+' value="pending">Pendiente</option><option '+(o.status==='accepted'?'selected':'')+' value="accepted">Aceptado</option><option '+(o.status==='preparing'?'selected':'')+' value="preparing">Preparando</option><option '+(o.status==='ready'?'selected':'')+' value="ready">Listo</option><option '+(o.status==='delivered'?'selected':'')+' value="delivered">Entregado</option><option '+(o.status==='cancelled'?'selected':'')+' value="cancelled">Cancelado</option></select><span class="pill '+(o.status==='cancelled'?'red':o.status==='delivered'?'':'gold')+'">'+esc(o.status)+'</span></div>'
}
function financeView(){
 var f=state.finance||{summary:{},days:[]};var s=f.summary||{};return '<section class="section-intro"><div><span class="section-kicker">Caja y análisis</span><h2>Movimientos</h2><p>Revisa día a día cuánto se generó, cuánto se confirmó y cuánto dinero se movió.</p></div></section><div class="adm-card"><div class="date-bar"><div class="date-field"><label>Desde</label><input id="fin-from" type="date" value="'+esc(f.from||today())+'"></div><div class="date-field"><label>Hasta</label><input id="fin-to" type="date" value="'+esc(f.to||today())+'"></div><button class="adm-btn" id="finance-load">Consultar período</button></div><div class="finance-summary"><div class="finance-kpi gold"><small>Generado</small><strong>'+money(s.gross)+'</strong></div><div class="finance-kpi"><small>Confirmado</small><strong>'+money(s.confirmed)+'</strong></div><div class="finance-kpi"><small>Cancelado</small><strong>'+money(s.cancelled)+'</strong></div><div class="finance-kpi"><small>Pedidos</small><strong>'+Number(s.orders||0)+'</strong></div><div class="finance-kpi"><small>Movimiento neto</small><strong>'+money(s.movement)+'</strong></div></div><div class="table-wrap"><table class="finance-table"><thead><tr><th>Fecha</th><th>Pedidos</th><th>Generado</th><th>Confirmado</th><th>Cancelado</th><th>Movimiento</th><th>Actividad</th></tr></thead><tbody>'+(f.days&&f.days.length?f.days.map(function(d){var max=Math.max.apply(null,f.days.map(function(x){return Number(x.gross)||0}).concat([1]));return '<tr><td><strong>'+esc(d.date)+'</strong></td><td>'+Number(d.orders||0)+'</td><td><strong>'+money(d.gross)+'</strong></td><td>'+money(d.confirmed)+'</td><td>'+money(d.cancelled)+'</td><td>'+money(d.movement)+'</td><td><div class="bar"><i style="width:'+Math.min(100,(Number(d.gross||0)/max)*100)+'%"></i></div></td></tr>'}).join(''):'<tr><td colspan="7"><div class="empty-state"><strong>Sin movimientos en este período</strong>Prueba con otro rango de fechas.</div></td></tr>')+'</tbody></table></div></div>';
}
function bindView(){
 var q=document.getElementById('guest-search');if(q)q.oninput=function(){var term=this.value.toLowerCase().trim();document.querySelectorAll('[data-guest-row]').forEach(function(row){row.style.display=!term||row.dataset.search.indexOf(term)>=0?'':'none'})};
 var ng=document.getElementById('new-guest');if(ng)ng.onclick=function(){guestModal()};
 var qg=document.getElementById('quick-guest');if(qg)qg.onclick=function(){guestModal()};
 document.querySelectorAll('.edit-guest').forEach(function(b){b.onclick=function(){guestModal(b.dataset.id)}});
 document.querySelectorAll('.pass-guest').forEach(function(b){b.onclick=function(){passwordModal(b.dataset.id)}});
 document.querySelectorAll('.delete-guest').forEach(function(b){b.onclick=function(){deleteGuest(b.dataset.id)}});
 document.querySelectorAll('.room-card').forEach(function(b){b.onclick=function(){roomModal(b.dataset.room)}});
 document.querySelectorAll('.order-status').forEach(function(s){s.onchange=function(){req('admin-order-update',{id:s.dataset.id,status:s.value},function(code,d){if(code<200||code>=300)alert(d.error||'No se pudo actualizar el pedido.');else loadAll()})}});
 var fr=document.getElementById('finance-load');if(fr)fr.onclick=function(){loadFinance(document.getElementById('fin-from').value,document.getElementById('fin-to').value)};
 var or=document.getElementById('orders-refresh');if(or)or.onclick=loadAll;
}
function guestModal(id){
 var g=id?state.guests.find(function(x){return x.id===id}):null,rooms=state.rooms;
 openModal(g?'Editar huésped':'Nuevo huésped', '<form id="guest-form"><div class="form-grid"><div class="field"><label>Nombre completo</label><input name="display_name" required value="'+esc(g?.display_name||'')+'"></div><div class="field"><label>Usuario</label><input name="username" required pattern="[A-Za-z0-9._-]{3,32}" value="'+esc(g?.username||'')+'"></div><div class="field"><label>Habitación</label><select name="room_number" required>'+rooms.map(function(r){return '<option value="'+esc(r.room_number)+'" '+(g?.room_number===r.room_number?'selected':'')+'>'+esc(r.room_number)+' · '+Number(r.guest_count||0)+'/'+Number(r.max_occupancy||2)+'</option>'}).join('')+'</select></div><div class="field"><label>Estado</label><select name="status"><option value="active" '+(g?.status==='active'||!g?'selected':'')+'>Activo</option><option value="checked_out" '+(g?.status==='checked_out'?'selected':'')+'>Check-out</option><option value="blocked" '+(g?.status==='blocked'?'selected':'')+'>Bloqueado</option></select></div><div class="field"><label>Check-in</label><input name="check_in" type="date" value="'+esc(g?.check_in||'')+'"></div><div class="field"><label>Check-out</label><input name="check_out" type="date" value="'+esc(g?.check_out||'')+'"></div><div class="field"><label>Teléfono</label><input name="phone" value="'+esc(g?.phone||'')+'"></div><div class="field"><label>Descuento</label><input value="'+Number(g?.discount_percent||10)+'% · gestionado por sistema" disabled></div><div class="field full"><label>Notas de recepción</label><textarea name="notes" placeholder="Preferencias, observaciones, información útil para recepción...">'+esc(g?.notes||'')+'</textarea></div>'+(g?'':'<div class="field"><label>Contraseña inicial</label><input name="password" type="password" minlength="6" required placeholder="Se mostrará solo al crearla"></div>')+'</div><div class="notice" style="margin-top:13px">La contraseña existente no se puede recuperar. Para cambiarla usa la acción <strong>Clave</strong> desde el registro.</div><div id="guest-form-msg"></div><div class="form-actions"><button type="button" class="adm-btn light" id="cancel-modal">Cancelar</button><button class="adm-btn">'+(g?'Guardar cambios':'Crear huésped')+'</button></div></form>','Huéspedes');
 document.getElementById('cancel-modal').onclick=closeModal;
 document.getElementById('guest-form').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button.adm-btn:last-child'),m=document.getElementById('guest-form-msg');b.disabled=true;var body={display_name:f.display_name.value,username:f.username.value,room_number:f.room_number.value,status:f.status.value,check_in:f.check_in.value||null,check_out:f.check_out.value||null,phone:f.phone.value,notes:f.notes.value};if(!g)body.password=f.password.value;req(g?'admin-guest-update':'guest-create',g?Object.assign({id:g.id},body):body,function(s,d){b.disabled=false;if(s>=200&&s<300){notify(m,g?'Cambios guardados.':'Huésped creado correctamente.',true);if(!g&&d.profile){setTimeout(function(){passwordCreatedModal(d.profile)},500)}else{setTimeout(function(){closeModal();loadAll()},500)}}else notify(m,d.error||'No se pudo guardar el huésped.',false)})}
}
function passwordModal(id){
 var g=state.guests.find(function(x){return x.id===id});if(!g)return;
 openModal('Cambiar contraseña','<form id="pass-form"><div class="notice">Vas a establecer una nueva contraseña para <strong>'+esc(g.display_name)+'</strong> (@'+esc(g.username)+'). La contraseña actual nunca se muestra.</div><div class="field" style="margin-top:14px"><label>Nueva contraseña</label><input name="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"></div><div id="pass-msg"></div><div class="form-actions"><button type="button" class="adm-btn light" id="cancel-modal">Cancelar</button><button class="adm-btn">Actualizar contraseña</button></div></form>','Seguridad');
 document.getElementById('cancel-modal').onclick=closeModal;document.getElementById('pass-form').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button.adm-btn:last-child'),m=document.getElementById('pass-msg');b.disabled=true;req('admin-guest-password',{id:id,password:f.password.value},function(s,d){b.disabled=false;if(s>=200&&s<300){notify(m,'Contraseña actualizada. Entrégala al huésped de forma segura.',true);f.reset()}else notify(m,d.error||'No se pudo actualizar.',false)})}
}
function passwordCreatedModal(p){
 closeModal();openModal('Cuenta creada','<div class="notice">Entrega estas credenciales al huésped y evita dejarlas expuestas en el sistema. La contraseña se muestra aquí porque acaba de ser creada.</div><div class="grid-2" style="margin-top:15px"><div class="adm-card"><p>Usuario</p><strong style="font-size:20px">'+esc(p.username)+'</strong></div><div class="adm-card"><p>Contraseña</p><strong style="font-size:20px">La contraseña ingresada al crearla</strong><small style="display:block;color:#888;margin-top:5px">Por seguridad, OcaranzaConnect no la almacena para volver a mostrarla.</small></div></div><div class="form-actions"><button class="adm-btn" id="done-created">Entendido</button></div>','Credenciales');
 document.getElementById('done-created').onclick=function(){closeModal();loadAll()}
}
function roomModal(roomNumber){
 var r=state.rooms.find(function(x){return x.room_number===roomNumber});if(!r)return;
 openModal('Habitación '+esc(r.room_number),'<form id="room-form"><div class="grid-2"><div class="adm-card"><p>Hués­pedes activos</p><strong style="font-size:27px">'+Number(r.guest_count||0)+'</strong><small style="display:block;color:#888;margin-top:4px">de '+Number(r.max_occupancy||2)+' permitidos</small></div><div class="adm-card"><p>Espacios disponibles</p><strong style="font-size:27px;color:#806536">'+Number(r.available_spaces||0)+'</strong></div></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Capacidad máxima</label><input name="max_occupancy" type="number" min="1" max="10" value="'+Number(r.max_occupancy||2)+'"></div><div class="field"><label>Estado</label><select name="status"><option value="available" '+(r.status==='available'?'selected':'')+'>Disponible</option><option value="maintenance" '+(r.status==='maintenance'?'selected':'')+'>Mantención</option><option value="blocked" '+(r.status==='blocked'?'selected':'')+'>Bloqueada</option></select></div></div><div id="room-msg"></div><div class="form-actions"><button type="button" class="adm-btn light" id="cancel-modal">Cerrar</button><button class="adm-btn">Guardar habitación</button></div></form>','Habitaciones');
 document.getElementById('cancel-modal').onclick=closeModal;document.getElementById('room-form').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button.adm-btn:last-child'),m=document.getElementById('room-msg');b.disabled=true;req('admin-room-update',{room_number:r.room_number,max_occupancy:f.max_occupancy.value,status:f.status.value},function(s,d){b.disabled=false;if(s>=200&&s<300){notify(m,'Habitación actualizada.',true);setTimeout(function(){closeModal();loadAll()},450)}else notify(m,d.error||'No se pudo actualizar.',false)})}
}
function deleteGuest(id){
 var g=state.guests.find(function(x){return x.id===id});if(!g)return;
 if(!confirm('Dar de baja a '+g.display_name+'? Su acceso quedará deshabilitado y el historial de pedidos/movimientos se conservará.'))return;
 req('admin-guest-delete',{id:id},function(s,d){if(s>=200&&s<300)loadAll();else alert(d.error||'No se pudo dar de baja.')})
}
function loadAll(){
 if(!token())return;state.loading=true;shell();renderViews();
 req('admin-guests',{},function(s,d){if(s===401||s===403){clear();render();return}if(s>=200&&s<300){state.guests=d.guests||[];state.rooms=d.rooms||[];renderViews()}else alert(d.error||'No se pudo cargar huéspedes.')});
 req('admin-orders',{},function(s,d){if(s>=200&&s<300){state.orders=d.orders||[];renderViews()}});
 loadFinance(today(),today(),false);
}
function loadFinance(from,to,rerender){
 req('admin-finance',{from:from||today(),to:to||today()},function(s,d){if(s>=200&&s<300){state.finance=d;if(rerender!==false)renderViews()}})
}
function render(){
 if(token()){loadAll();return}
 health(function(s,d){loginView(!!d&&d.adminExists===false)})
}
render();
})();
</script>
</body>
</html>
