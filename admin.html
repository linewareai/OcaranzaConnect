<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b09"><title>OcaranzaConnect · PMS</title>
<link rel="stylesheet" href="/static/app.css">
<style>
:root{--ink:#18251f;--black:#0a0a09;--gold:#c6a15d;--gold2:#e1c37d;--paper:#f5f1e8;--card:#fffdfa;--line:#e1d9cb;--muted:#777168;--green:#3e7258;--red:#a24b42;--blue:#456b82}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f2ede3,#fbfaf7 35%,#f4f0e8);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1500px;margin:auto;padding:18px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}.brand{display:flex;align-items:center;gap:12px}.logo-h{font:500 38px Georgia,serif;line-height:.7}.logo-word{display:block;font-size:6px;letter-spacing:.25em;font-weight:900;margin-top:5px}.brand-copy small{display:block;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#928b7f}.brand-copy strong{font:500 22px Georgia,serif}.actions{display:flex;gap:7px}.btn{border:1px solid var(--gold);background:var(--black);color:var(--gold2);border-radius:11px;padding:10px 13px;font-size:10px;font-weight:900;cursor:pointer}.btn.light{background:var(--card);color:var(--ink);border-color:#d6cdbf}.btn.danger{background:#fff2ef;color:var(--red);border-color:#ddb1aa}.nav{display:flex;gap:5px;overflow:auto;background:var(--black);padding:6px;border:1px solid #b5965d;border-radius:17px;position:sticky;top:8px;z-index:20;box-shadow:0 10px 25px #0002}.nav button{border:0;background:transparent;color:#aaa59c;border-radius:11px;padding:10px 12px;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active{background:linear-gradient(145deg,#d8b873,#b98f48);color:#111}.view{display:none}.view.active{display:block}.intro{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:23px 0 14px}.intro h1{margin:3px 0 0;font:500 30px Georgia,serif;letter-spacing:-.03em}.intro p{margin:5px 0 0;color:var(--muted);font-size:11px}.kicker{font-size:8px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#9b783b}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:0 12px 32px #26352c0b}.metric{background:var(--black);color:#fff;border:1px solid #b4965d;border-radius:17px;padding:15px;min-height:105px}.metric small{display:block;color:#aaa49a;font-size:8px;text-transform:uppercase;letter-spacing:.1em}.metric strong{display:block;color:var(--gold2);font-size:24px;margin-top:8px}.metric span{display:block;color:#88827a;font-size:9px;margin-top:4px}.toolbar{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap}.search,input,select,textarea{font:inherit}.search,.field input,.field select,.field textarea{border:1px solid #d7cfc2;background:#fffdfa;border-radius:10px;padding:10px 11px;font-size:11px;outline:none}.search{min-width:230px}.table{width:100%;border-collapse:collapse}.table th{padding:10px;text-align:left;background:#f5f0e7;color:#898278;font-size:8px;text-transform:uppercase;letter-spacing:.1em}.table td{padding:11px 10px;border-top:1px solid #ebe4d9;font-size:10px;vertical-align:middle}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#e8f1ea;color:#3e654e;font-size:8px;font-weight:900;text-transform:uppercase}.pill.gold{background:#f3ead7;color:#806536}.pill.red{background:#f7e8e5;color:#914039}.pill.gray{background:#ece9e4;color:#6e685f}.muted{color:#8a847b;font-size:9px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fffdfa}.empty{text-align:center;padding:35px;color:#878077;font-size:10px}.room-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.room{background:#fffdfa;border:1px solid #ddd5c8;border-radius:16px;padding:14px;min-height:145px;cursor:pointer;position:relative}.room.occupied{background:#fff8e9;border-color:#c8a76b}.room.maintenance{background:#f0eeea}.room strong{font:600 20px Georgia,serif}.room small{display:block;color:#908a80;font-size:8px;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}.room .cap{position:absolute;right:12px;top:13px;font-size:8px;color:#777}.room .state{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:99px;background:#e8f1ea;color:#3d644d;font-size:8px;font-weight:900}.room.occupied .state{background:#0b0b09;color:#dfc17d}.room.maintenance .state{background:#e5e2dc;color:#6d675f}.room .guest{border-top:1px solid #e4dccf;margin-top:10px;padding-top:9px;font-size:9px}.calendar-card{padding:12px}.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.cal-head strong{font:500 20px Georgia,serif}.calendar{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fffdfa}.cal-grid{display:grid;grid-template-columns:110px repeat(14,minmax(70px,1fr));min-width:1100px}.cal-cell{min-height:62px;border-right:1px solid #eee7dc;border-bottom:1px solid #eee7dc;padding:7px;position:relative}.cal-day{min-height:45px;background:#f5f0e7;text-align:center;font-size:8px;font-weight:900}.cal-room{background:#faf7f0;font-weight:900;font-size:10px;display:flex;align-items:center}.booking{position:absolute;left:3px;right:3px;top:9px;height:43px;border-radius:9px;background:#17352a;color:#e9d18e;padding:6px 7px;overflow:hidden;z-index:2;box-shadow:0 5px 12px #0002}.booking.confirmed{background:#21483a}.booking.checked_in{background:#0b0b09}.booking.tentative{background:#8b7245}.booking.cancelled{background:#8d4038}.booking strong{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.booking small{display:block;font-size:7px;color:#d6d0c5;margin-top:2px}.mobile-agenda{display:none}.ops-list{display:flex;flex-direction:column;gap:7px}.op{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e4ddd2;border-radius:12px;padding:10px;background:#fffdfa}.op strong{font-size:10px}.op small{display:block;color:#888;font-size:8px;margin-top:3px}.select{border:1px solid #d5cdbf;border-radius:8px;background:#fffdfa;padding:7px;font-size:9px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:8px;font-weight:900;text-transform:uppercase;color:#6f685f;letter-spacing:.08em}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(7px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fffdfa;border:1px solid var(--gold);border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.modal-head h2{margin:2px 0;font:500 23px Georgia,serif}.close{border:1px solid #d5cdbf;background:#f7f3eb;border-radius:9px;padding:7px 10px;cursor:pointer}.notice{padding:10px 12px;border-left:2px solid var(--gold);background:#f5efe4;border-radius:0 9px 9px 0;color:#6e675d;font-size:9px;line-height:1.5}.finance{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.finance>div{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fffdfa}.finance small{display:block;color:#888;font-size:7px;text-transform:uppercase}.finance strong{display:block;margin-top:5px;font-size:17px}.login{max-width:430px;margin:90px auto}.error{color:var(--red);font-size:9px;margin-top:8px}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.room-grid{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:1fr 1fr}.finance{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.shell{padding:12px 10px 45px}.top{align-items:flex-start}.brand-copy strong{font-size:17px}.actions .btn:first-child{display:none}.nav{top:4px}.nav button{padding:9px 10px;font-size:9px}.intro{display:block;margin-top:18px}.intro h1{font-size:25px}.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.metric{min-height:90px;padding:12px}.metric strong{font-size:20px}.room-grid{grid-template-columns:1fr 1fr}.table-wrap{margin:0}.calendar{display:none}.mobile-agenda{display:flex;flex-direction:column;gap:8px}.agenda-day{font:500 18px Georgia,serif;margin:5px 0}.booking-mobile{border:1px solid #d8cfbf;border-left:4px solid #17352a;border-radius:12px;background:#fffdfa;padding:10px}.booking-mobile strong{font-size:11px}.booking-mobile small{display:block;color:#888;font-size:8px;margin-top:3px}.search{width:100%;min-width:0}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.finance{grid-template-columns:1fr 1fr}.login{margin:45px auto}.card{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><div><span id="mk" class="kicker">PMS</span><h2 id="mt">Gestión</h2></div><button class="close" id="mc">Cerrar</button></div><div id="mb"></div></div></div>
<script>
(function(){
var API='https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-auth';
var app=document.getElementById('app'),state={tab:'dashboard',guests:[],rooms:[],orders:[],finance:null,pms:{reservations:[],housekeeping:[],maintenance:[],payments:[]},from:today(),to:addDays(today(),13)};
function token(){try{return localStorage.getItem('oc_admin_token')||''}catch(e){return''}}
function clear(){try{localStorage.removeItem('oc_admin_token')}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(n){return '$'+Number(n||0).toLocaleString('es-CL')}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Santiago'})}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')}
function fmtDate(s){if(!s)return '—';return new Date(s+'T12:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'short'})}
function req(path,body,done){var x=new XMLHttpRequest();x.open('POST',API+'/'+path,true);x.setRequestHeader('Content-Type','application/json');if(token())x.setRequestHeader('Authorization','Bearer '+token());x.onreadystatechange=function(){if(x.readyState!==4)return;var d={};try{d=JSON.parse(x.responseText||'{}')}catch(e){}done(x.status,d)};x.onerror=function(){done(0,{error:'No se pudo conectar con OcaranzaConnect.'})};x.send(JSON.stringify(body||{}))}
function modal(title,body,k){document.getElementById('mk').textContent=k||'PMS';document.getElementById('mt').textContent=title;document.getElementById('mb').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('mc').onclick=closeModal;document.getElementById('modal').onclick=function(e){if(e.target===this)closeModal()}
function login(){app.innerHTML='<div class="shell"><div class="card login"><div style="text-align:center"><span class="logo-h">H</span><span class="logo-word">OCARANZA</span></div><span class="kicker">Gestión interna</span><h1 style="font:500 27px Georgia,serif;margin:6px 0 4px">Centro PMS</h1><p class="muted" style="line-height:1.6">Acceso exclusivo para recepción y administración.</p><form id="lf"><div class="field" style="margin-top:15px"><label>Usuario</label><input name="username" value="Admin" readonly></div><div class="field" style="margin-top:10px"><label>Contraseña</label><input name="password" type="password" required minlength="8"></div><button class="btn" style="width:100%;margin-top:14px">Ingresar</button><div id="le"></div></form></div></div>';document.getElementById('lf').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button'),m=document.getElementById('le');b.disabled=true;req('login',{username:'Admin',password:f.password.value},function(s,d){if(s>=200&&s<300&&d.session){localStorage.setItem('oc_admin_token',d.session.access_token);load()}else{b.disabled=false;m.className='error';m.textContent=d.error||'No se pudo iniciar sesión.'}})}}
function shell(){app.innerHTML='<div class="shell"><header class="top"><div class="brand"><div><span class="logo-h">H</span><span class="logo-word">OCARANZA</span></div><div class="brand-copy"><small>PMS · Operaciones</small><strong>Centro de administración</strong></div></div><div class="actions"><button class="btn light" id="refresh">Actualizar</button><button class="btn" id="logout">Salir</button></div></header><nav class="nav">'+[['dashboard','Inicio'],['calendar','Calendario'],['reservations','Reservas'],['rooms','Habitaciones'],['guests','Huéspedes'],['operations','Operación'],['orders','Pedidos'],['finance','Caja'],['reports','Reportes'],['settings','Config.']].map(function(x){return '<button data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</nav><main id="views"></main></div>';document.getElementById('logout').onclick=function(){clear();login()};document.getElementById('refresh').onclick=load;document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;render()}})}
function load(){if(!token())return login();shell();req('admin-guests',{},function(s,d){if(s===401||s===403){clear();return login()}if(s>=200&&s<300){state.guests=d.guests||[];state.rooms=d.rooms||[];render()}});req('admin-orders',{},function(s,d){if(s>=200&&s<300){state.orders=d.orders||[];render()}});req('admin-finance',{from:today(),to:today()},function(s,d){if(s>=200&&s<300){state.finance=d;render()}});loadPms()}
function loadPms(){req('admin-pms',{from:state.from,to:state.to},function(s,d){if(s>=200&&s<300){state.pms=d;render()}})}
function render(){if(!document.getElementById('views'))return;document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)});var v=document.getElementById('views');v.innerHTML=state.tab==='dashboard'?dashboard():state.tab==='calendar'?calendar():state.tab==='reservations'?reservations():state.tab==='rooms'?rooms():state.tab==='guests'?guests():state.tab==='operations'?operations():state.tab==='orders'?orders():state.tab==='finance'?finance():state.tab==='reports'?reports():settings();bind()}
function dashboard(){var occ=state.rooms.filter(r=>r.occupied).length,active=state.guests.filter(g=>g.status==='active').length,pending=state.orders.filter(o=>o.status==='pending').length,arr=state.pms.reservations.filter(r=>r.arrival_date===today()&&r.status!=='cancelled').length,dep=state.pms.reservations.filter(r=>r.departure_date===today()&&r.status!=='cancelled').length;return '<section class="intro"><div><span class="kicker">Recepción</span><h1>Buenos días, Admin</h1><p>Vista operativa del Hotel Ocaranza.</p></div><button class="btn" id="new-guest">+ Huésped</button></section><div class="grid4"><div class="metric"><small>Ocupación</small><strong>'+occ+'/'+state.rooms.length+'</strong><span>Habitaciones ocupadas</span></div><div class="metric"><small>Huéspedes</small><strong>'+active+'</strong><span>Alojados ahora</span></div><div class="metric"><small>Llegadas</small><strong>'+arr+'</strong><span>Reservas hoy</span></div><div class="metric"><small>Salidas</small><strong>'+dep+'</strong><span>Check-out hoy</span></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Habitaciones</h3><p class="muted">Estado actual y capacidad.</p><div class="room-grid" style="grid-template-columns:repeat(2,1fr);margin-top:12px">'+state.rooms.map(roomCard).join('')+'</div></div><div class="card"><h3>Hoy en recepción</h3><div class="ops-list" style="margin-top:12px"><div class="op"><div><strong>'+arr+' llegadas</strong><small>Revisar reservas del día</small></div><button class="btn light" data-tab-go="calendar">Calendario</button></div><div class="op"><div><strong>'+dep+' salidas</strong><small>Preparar check-out y limpieza</small></div><button class="btn light" data-tab-go="operations">Operación</button></div><div class="op"><div><strong>'+pending+' pedidos</strong><small>Requieren atención</small></div><button class="btn light" data-tab-go="orders">Pedidos</button></div></div></div></div>'}
function roomCard(r){var hs=state.pms.housekeeping.find(x=>x.room_number===r.room_number)||{};return '<div class="room '+(r.occupied?'occupied ':'')+(r.status==='maintenance'?'maintenance':'')+'" data-room="'+esc(r.room_number)+'"><strong>'+esc(r.room_number)+'</strong><span class="cap">'+Number(r.guest_count||0)+'/'+Number(r.max_occupancy||2)+'</span><small>Piso '+esc(r.floor)+'</small><span class="state">'+(r.status==='maintenance'?'Mantención':r.status==='blocked'?'Bloqueada':r.occupied?'Ocupada':'Disponible')+'</span><div class="guest">'+(r.guest_count?'Ocupada · '+esc((state.guests.find(g=>g.room_number===r.room_number&&g.status==='active')||{}).display_name||'Huésped'):'Sin huéspedes')+'<br><span class="muted">Housekeeping: '+esc(hs.status||'clean')+'</span></div></div>'}
function calendar(){var days=[];for(var i=0;i<14;i++)days.push(addDays(state.from,i));var res=state.pms.reservations.filter(r=>r.status!=='cancelled');return '<section class="intro"><div><span class="kicker">Planificación</span><h1>Calendario de reservas</h1><p>Las reservas reflejadas aquí son informativas. La fuente de verdad sigue siendo Little Hotelier.</p></div><div><button class="btn light" id="prev14">‹</button> <button class="btn light" id="today14">Hoy</button> <button class="btn light" id="next14">›</button></div></section><div class="notice" style="margin-bottom:10px">Preparado para sincronizar reservas externas mediante <strong>external_source</strong> y <strong>external_id</strong>. No se escriben reservas en el PMS externo desde aquí.</div><div class="card calendar-card"><div class="calendar"><div class="cal-grid"><div class="cal-cell cal-day">Habitación</div>'+days.map(function(d){return '<div class="cal-cell cal-day">'+fmtDate(d)+'<br>'+new Date(d+'T12:00:00').toLocaleDateString('es-CL',{weekday:'short'})+'</div>'}).join('')+state.rooms.map(function(room){var cells='<div class="cal-cell cal-room">'+esc(room.room_number)+'</div>';for(var j=0;j<14;j++){var day=days[j];var cellRes=res.filter(function(r){return r.room_number===room.room_number&&r.arrival_date<=day&&r.departure_date>day});cells+='<div class="cal-cell">'+cellRes.map(function(r){return j===days.indexOf(r.arrival_date)||r.arrival_date<state.from&&j===0?'<div class="booking '+esc(r.status)+'"><strong>'+esc(r.guest_name)+'</strong><small>'+fmtDate(r.arrival_date)+' → '+fmtDate(r.departure_date)+'</small></div>':''}).join('')+'</div>'}return cells}).join('')+'</div></div><div class="mobile-agenda">'+days.slice(0,7).map(function(d){var rs=res.filter(function(r){return r.arrival_date<=d&&r.departure_date>d});return '<div><div class="agenda-day">'+fmtDate(d)+'</div>'+(rs.length?rs.map(function(r){return '<div class="booking-mobile"><strong>Hab. '+esc(r.room_number||'—')+' · '+esc(r.guest_name)+'</strong><small>'+fmtDate(r.arrival_date)+' → '+fmtDate(r.departure_date)+' · '+esc(r.status)+'</small></div>'}).join(''):'<div class="muted">Sin reservas alojadas este día.</div>')+'</div>'}).join('')+'</div></div>'}
function reservations(){var rows=state.pms.reservations;return '<section class="intro"><div><span class="kicker">Fuente externa</span><h1>Reservas</h1><p>Espejo operativo de las reservas provenientes del PMS principal.</p></div></section><div class="toolbar"><input id="res-search" class="search" placeholder="Buscar huésped, reserva o habitación"><span class="muted">'+rows.length+' reservas reflejadas</span></div><div class="card table-wrap"><table class="table"><thead><tr><th>Reserva</th><th>Huésped</th><th>Habitación</th><th>Estadía</th><th>Canal</th><th>Estado</th><th>Total</th></tr></thead><tbody>'+ (rows.length?rows.map(function(r){return '<tr data-res data-search="'+esc((r.guest_name+' '+r.reservation_code+' '+r.room_number).toLowerCase())+'"><td><strong>'+esc(r.reservation_code||r.external_id||'—')+'</strong><br><span class="muted">'+esc(r.external_source)+'</span></td><td><strong>'+esc(r.guest_name)+'</strong><br><span class="muted">'+esc(r.guest_phone||r.guest_email||'')+'</span></td><td>'+esc(r.room_number||'Sin asignar')+'</td><td>'+fmtDate(r.arrival_date)+' → '+fmtDate(r.departure_date)+'</td><td>'+esc(r.source_channel)+'</td><td><span class="pill '+(r.status==='cancelled'?'red':r.status==='checked_in'?'':'gold')+'">'+esc(r.status)+'</span></td><td>'+money(r.total_amount)+'</td></tr>'}).join(''):'<tr><td colspan="7"><div class="empty"><strong>No hay reservas sincronizadas todavía.</strong><br>El calendario quedará listo para recibir los datos del PMS principal.</div></td></tr>')+'</tbody></table></div>'}
function rooms(){return '<section class="intro"><div><span class="kicker">Inventario físico</span><h1>Habitaciones</h1><p>Capacidad, ocupación, estado y housekeeping.</p></div></section><div class="room-grid">'+state.rooms.map(roomCard).join('')+'</div>'}
function guests(){return '<section class="intro"><div><span class="kicker">CRM de huéspedes</span><h1>Huéspedes</h1><p>Las cuentas creadas aquí quedan activas por defecto. El historial se conserva al dar de baja.</p></div><button class="btn" id="new-guest">+ Nuevo huésped</button></section><div class="toolbar"><input id="guest-search" class="search" placeholder="Buscar nombre, usuario o habitación"><span class="muted">'+state.guests.length+' registros</span></div><div class="card table-wrap"><table class="table"><thead><tr><th>Huésped</th><th>Habitación</th><th>Estadía</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="guest-body">'+state.guests.map(function(g){return '<tr data-guest data-search="'+esc((g.display_name+' '+g.username+' '+g.room_number).toLowerCase())+'"><td><strong>'+esc(g.display_name)+'</strong><br><span class="muted">@'+esc(g.username)+'</span></td><td>'+esc(g.room_number)+'</td><td>'+fmtDate(g.check_in)+' → '+fmtDate(g.check_out)+'</td><td><span class="pill '+(g.status==='active'?'':g.status==='checked_out'?'gray':'red')+'">'+esc(g.status)+'</span></td><td><button class="btn light edit" data-id="'+esc(g.id)+'">Editar</button> <button class="btn light pass" data-id="'+esc(g.id)+'">Clave</button> <button class="btn danger del" data-id="'+esc(g.id)+'">Baja</button></td></tr>'}).join('')+'</tbody></table></div>'}
function operations(){return '<section class="intro"><div><span class="kicker">Operación</span><h1>Housekeeping y mantenimiento</h1><p>La operación diaria separada del calendario de reservas.</p></div><button class="btn" id="new-maint">+ Incidencia</button></section><div class="grid2"><div class="card"><h3>Housekeeping</h3><p class="muted">Estado de cada habitación.</p><div class="ops-list" style="margin-top:12px">'+state.rooms.map(function(r){var h=state.pms.housekeeping.find(x=>x.room_number===r.room_number)||{status:'clean',priority:'normal'};return '<div class="op"><div><strong>Hab. '+esc(r.room_number)+'</strong><small>'+esc(h.note||'')+'</small></div><select class="select hk" data-room="'+esc(r.room_number)+'"><option value="clean" '+(h.status==='clean'?'selected':'')+'>Limpia</option><option value="dirty" '+(h.status==='dirty'?'selected':'')+'>Sucia</option><option value="cleaning" '+(h.status==='cleaning'?'selected':'')+'>En limpieza</option><option value="inspected" '+(h.status==='inspected'?'selected':'')+'>Inspeccionada</option><option value="out_of_order" '+(h.status==='out_of_order'?'selected':'')+'>Fuera de servicio</option></select></div>'}).join('')+'</div></div><div class="card"><h3>Mantenimiento</h3><div class="ops-list" style="margin-top:12px">'+(state.pms.maintenance.length?state.pms.maintenance.map(function(m){return '<div class="op"><div><strong>'+esc(m.title)+'</strong><small>Hab. '+esc(m.room_number||'general')+' · '+esc(m.priority)+'</small></div><select class="select maint" data-id="'+m.id+'"><option value="open" '+(m.status==='open'?'selected':'')+'>Abierto</option><option value="in_progress" '+(m.status==='in_progress'?'selected':'')+'>En curso</option><option value="resolved" '+(m.status==='resolved'?'selected':'')+'>Resuelto</option><option value="cancelled" '+(m.status==='cancelled'?'selected':'')+'>Cancelado</option></select></div>'}).join(''):'<div class="empty">No hay incidencias registradas.</div>')+'</div></div></div>'}
function orders(){return '<section class="intro"><div><span class="kicker">Guest services</span><h1>Pedidos</h1><p>Solicitudes de huéspedes y consumos operativos.</p></div></section><div class="card"><div class="ops-list">'+(state.orders.length?state.orders.map(function(o){var g=o.oc_guest_profiles||{};return '<div class="op"><div><strong>'+esc(o.item_name)+' · '+money(o.total)+'</strong><small>Hab. '+esc(g.room_number||'—')+' · '+esc(g.display_name||'Huésped')+'</small></div><select class="select order" data-id="'+o.id+'">'+['pending','accepted','preparing','ready','delivered','cancelled'].map(function(s){return '<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'}).join(''):'<div class="empty"><strong>No hay pedidos.</strong></div>')+'</div></div>'}
function finance(){var s=(state.finance||{}).summary||{};return '<section class="intro"><div><span class="kicker">Caja</span><h1>Movimientos</h1><p>Ingresos, pagos y actividad financiera por período.</p></div></section><div class="finance"><div><small>Generado</small><strong>'+money(s.gross)+'</strong></div><div><small>Confirmado</small><strong>'+money(s.confirmed)+'</strong></div><div><small>Cancelado</small><strong>'+money(s.cancelled)+'</strong></div><div><small>Pedidos</small><strong>'+Number(s.orders||0)+'</strong></div><div><small>Movimiento</small><strong>'+money(s.movement)+'</strong></div></div><div class="card" style="margin-top:12px"><div class="toolbar"><strong>Actividad diaria</strong><button class="btn light" id="fin-refresh">Actualizar</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Pedidos</th><th>Generado</th><th>Confirmado</th><th>Cancelado</th><th>Movimiento</th></tr></thead><tbody>'+((state.finance&&state.finance.days)||[]).map(function(d){return '<tr><td>'+esc(d.date)+'</td><td>'+d.orders+'</td><td>'+money(d.gross)+'</td><td>'+money(d.confirmed)+'</td><td>'+money(d.cancelled)+'</td><td>'+money(d.movement)+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function reports(){var occ=state.rooms.length?Math.round(state.rooms.filter(r=>r.occupied).length/state.rooms.length*100):0;return '<section class="intro"><div><span class="kicker">Inteligencia</span><h1>Reportes</h1><p>Primera capa de indicadores del PMS. La estructura queda lista para crecer.</p></div></section><div class="grid3"><div class="card"><span class="kicker">Ocupación actual</span><h2 style="font:500 32px Georgia,serif">'+occ+'%</h2><p class="muted">Basado en habitaciones ocupadas.</p></div><div class="card"><span class="kicker">Huéspedes activos</span><h2 style="font:500 32px Georgia,serif">'+state.guests.filter(g=>g.status==='active').length+'</h2><p class="muted">Perfiles actualmente alojados.</p></div><div class="card"><span class="kicker">Reservas reflejadas</span><h2 style="font:500 32px Georgia,serif">'+state.pms.reservations.length+'</h2><p class="muted">Datos provenientes del espejo PMS.</p></div></div><div class="card" style="margin-top:12px"><h3>Próximos indicadores</h3><p class="muted" style="line-height:1.7">ADR · RevPAR · ocupación por período · producción por canal · estadía promedio · cancelaciones · ingresos por habitación · consumo por huésped.</p></div>'}
function settings(){return '<section class="intro"><div><span class="kicker">Sistema</span><h1>Configuración</h1><p>La configuración operativa se irá centralizando aquí.</p></div></section><div class="grid2"><div class="card"><h3>Fuente de reservas</h3><p class="muted" style="line-height:1.6">Little Hotelier continúa siendo el sistema de reservas principal. OcaranzaConnect mantiene una copia operativa para visualización y operación.</p><div class="notice" style="margin-top:12px">La integración debe usar un mecanismo autorizado por el proveedor. No almacenaremos credenciales de acceso al PMS externo en el navegador.</div></div><div class="card"><h3>Hotel</h3><p class="muted">10 habitaciones · Ocaranza · Santiago</p><p class="muted">La configuración de capacidad, estados y módulos se administra desde este centro.</p></div></div>'}
function bind(){document.querySelectorAll('[data-tab-go]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tabGo;render()}});var ng=document.getElementById('new-guest');if(ng)ng.onclick=function(){guestModal()};var gs=document.getElementById('guest-search');if(gs)gs.oninput=function(){var t=this.value.toLowerCase();document.querySelectorAll('[data-guest]').forEach(function(r){r.style.display=r.dataset.search.indexOf(t)>=0?'':'none'})};document.querySelectorAll('.edit').forEach(function(b){b.onclick=function(){guestModal(b.dataset.id)}});document.querySelectorAll('.pass').forEach(function(b){b.onclick=function(){passModal(b.dataset.id)}});document.querySelectorAll('.del').forEach(function(b){b.onclick=function(){delGuest(b.dataset.id)}});document.querySelectorAll('.room').forEach(function(b){b.onclick=function(){roomModal(b.dataset.room)}});var rs=document.getElementById('res-search');if(rs)rs.oninput=function(){var t=this.value.toLowerCase();document.querySelectorAll('[data-res]').forEach(function(r){r.style.display=r.dataset.search.indexOf(t)>=0?'':'none'})};document.querySelectorAll('.hk').forEach(function(s){s.onchange=function(){req('admin-pms-housekeeping',{room_number:s.dataset.room,status:s.value,priority:'normal'},function(){loadPms()})}});document.querySelectorAll('.maint').forEach(function(s){s.onchange=function(){req('admin-pms-maintenance',{op:'update',id:s.dataset.id,status:s.value},function(){loadPms()})}});document.querySelectorAll('.order').forEach(function(s){s.onchange=function(){req('admin-order-update',{id:s.dataset.id,status:s.value},function(){load()})}});var nm=document.getElementById('new-maint');if(nm)nm.onclick=maintenanceModal;var p=document.getElementById('prev14');if(p)p.onclick=function(){state.from=addDays(state.from,-14);state.to=addDays(state.from,13);loadPms()};var n=document.getElementById('next14');if(n)n.onclick=function(){state.from=addDays(state.from,14);state.to=addDays(state.from,13);loadPms()};var t=document.getElementById('today14');if(t)t.onclick=function(){state.from=today();state.to=addDays(state.from,13);loadPms()};var fr=document.getElementById('fin-refresh');if(fr)fr.onclick=load}
function guestModal(id){var g=id?state.guests.find(x=>x.id===id):null;modal(g?'Editar huésped':'Nuevo huésped','<form id="gf"><div class="formgrid"><div class="field"><label>Nombre</label><input name="display_name" required value="'+esc(g?.display_name||'')+'"></div><div class="field"><label>Usuario</label><input name="username" required value="'+esc(g?.username||'')+'"></div><div class="field"><label>Habitación</label><select name="room_number">'+state.rooms.map(function(r){return '<option value="'+esc(r.room_number)+'" '+(g?.room_number===r.room_number?'selected':'')+'>'+esc(r.room_number)+' · '+r.guest_count+'/'+r.max_occupancy+'</option>'}).join('')+'</select></div><div class="field"><label>Estado</label><select name="status"><option value="active" '+(g?.status==='active'||!g?'selected':'')+'>Activo</option><option value="checked_out" '+(g?.status==='checked_out'?'selected':'')+'>Check-out</option><option value="blocked" '+(g?.status==='blocked'?'selected':'')+'>Bloqueado</option></select></div><div class="field"><label>Check-in</label><input type="date" name="check_in" value="'+esc(g?.check_in||'')+'"></div><div class="field"><label>Check-out</label><input type="date" name="check_out" value="'+esc(g?.check_out||'')+'"></div><div class="field"><label>Teléfono</label><input name="phone" value="'+esc(g?.phone||'')+'"></div><div class="field"><label>Notas</label><input name="notes" value="'+esc(g?.notes||'')+'"></div>'+(!g?'<div class="field full"><label>Contraseña inicial</label><input name="password" type="password" required minlength="6"></div>':'')+'</div><div class="notice" style="margin-top:12px">Las cuentas nuevas quedan activas automáticamente. La contraseña se muestra una sola vez después de crearla.</div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cancelar</button><button class="btn">Guardar</button></div></form>','Huéspedes');document.getElementById('cancel').onclick=closeModal;document.getElementById('gf').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button.btn:last-child');b.disabled=true;var body={display_name:f.display_name.value,username:f.username.value,room_number:f.room_number.value,status:f.status.value,check_in:f.check_in.value||null,check_out:f.check_out.value||null,phone:f.phone.value,notes:f.notes.value};if(!g)body.password=f.password.value;req(g?'admin-guest-update':'guest-create',g?Object.assign({id:g.id},body):body,function(s,d){b.disabled=false;if(s>=200&&s<300){if(!g){modal('Cuenta creada','<div class="notice">Usuario: <strong>'+esc(d.profile.username)+'</strong><br>Contraseña: <strong>'+esc(body.password)+'</strong><br><br>Entrégala al huésped de forma segura.</div><div class="toolbar" style="margin-top:14px"><button class="btn" id="done">Entendido</button></div>','Credenciales');document.getElementById('done').onclick=function(){closeModal();load()}}else{closeModal();load()}}else alert(d.error||'No se pudo guardar.');});}
function passModal(id){var g=state.guests.find(x=>x.id===id);modal('Cambiar contraseña','<form id="pf"><div class="notice">La contraseña actual nunca se muestra. Establece una nueva.</div><div class="field" style="margin-top:12px"><label>Nueva contraseña</label><input name="password" type="password" minlength="6" required></div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cancelar</button><button class="btn">Actualizar</button></div></form>','Seguridad');document.getElementById('cancel').onclick=closeModal;document.getElementById('pf').onsubmit=function(e){e.preventDefault();req('admin-guest-password',{id:id,password:e.target.password.value},function(s,d){if(s>=200&&s<300){closeModal();alert('Contraseña actualizada.')}else alert(d.error||'No se pudo actualizar.');});}
function delGuest(id){var g=state.guests.find(x=>x.id===id);if(g&&confirm('Dar de baja a '+g.display_name+'? Se conservará el historial.'))req('admin-guest-delete',{id:id},function(s,d){if(s>=200&&s<300)load();else alert(d.error||'No se pudo dar de baja.')})}
function roomModal(room){var r=state.rooms.find(x=>x.room_number===room);modal('Habitación '+room,'<form id="rf"><div class="grid2"><div class="card"><span class="kicker">Ocupación</span><h2 style="font:500 28px Georgia,serif">'+r.guest_count+'/'+r.max_occupancy+'</h2></div><div class="card"><span class="kicker">Housekeeping</span><h2 style="font:500 20px Georgia,serif">'+esc((state.pms.housekeeping.find(x=>x.room_number===room)||{}).status||'clean')+'</h2></div></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Capacidad</label><input name="cap" type="number" min="1" max="10" value="'+r.max_occupancy+'"></div><div class="field"><label>Estado</label><select name="status"><option value="available">Disponible</option><option value="maintenance">Mantención</option><option value="blocked">Bloqueada</option></select></div></div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cerrar</button><button class="btn">Guardar</button></div></form>','Habitaciones');document.getElementById('rf').onsubmit=function(e){e.preventDefault();req('admin-room-update',{room_number:room,max_occupancy:e.target.cap.value,status:e.target.status.value},function(s,d){if(s>=200&&s<300){closeModal();load()}else alert(d.error||'No se pudo actualizar.')})};document.getElementById('cancel').onclick=closeModal}
function maintenanceModal(){modal('Nueva incidencia','<form id="mf"><div class="formgrid"><div class="field"><label>Título</label><input name="title" required placeholder="Ej. Fuga en ducha"></div><div class="field"><label>Habitación</label><select name="room_number"><option value="">General</option>'+state.rooms.map(r=>'<option>'+esc(r.room_number)+'</option>').join('')+'</select></div><div class="field full"><label>Descripción</label><textarea name="description"></textarea></div><div class="field"><label>Prioridad</label><select name="priority"><option>normal</option><option>high</option><option>urgent</option></select></div></div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cancelar</button><button class="btn">Crear incidencia</button></div></form>','Mantenimiento');document.getElementById('cancel').onclick=closeModal;document.getElementById('mf').onsubmit=function(e){e.preventDefault();var f=e.target;req('admin-pms-maintenance',{op:'create',title:f.title.value,room_number:f.room_number.value||null,description:f.description.value,priority:f.priority.value},function(s,d){if(s>=200&&s<300){closeModal();loadPms()}else alert(d.error||'No se pudo crear.')})}}
load();
})();
</script>
</body></html>
