/* Admin mobile app navigation + resilient loading */
.admin-mobile-nav{display:none}
.admin-more{display:none;position:fixed;inset:auto 10px 82px 10px;z-index:95;background:#0a0a09;border:1px solid #b5965d;border-radius:18px;padding:8px;box-shadow:0 20px 50px #0006}
.admin-more.open{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.admin-more button{border:1px solid #2b2a26;background:#151512;color:#e1c37d;border-radius:12px;padding:12px 10px;text-align:left;font-size:10px;font-weight:900}
.admin-more button.active{background:#d8b873;color:#111}
.admin-loading{display:flex;min-height:300px;align-items:center;justify-content:center}
.admin-loading-box{text-align:center;padding:28px;border:1px solid var(--line);border-radius:20px;background:#fffdfa;max-width:420px}
.admin-spinner{width:28px;height:28px;border:3px solid #e7dfd2;border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:adminSpin .8s linear infinite}
.admin-error{padding:12px;border-left:3px solid var(--red);background:#fff2ef;color:#813c35;border-radius:0 10px 10px 0;font-size:10px;margin-top:10px}
@keyframes adminSpin{to{transform:rotate(360deg)}}

  body{padding-bottom:82px}
  .nav{display:none}
  .admin-mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:9px;right:9px;bottom:7px;z-index:90;background:#090908;border:1px solid #b5965d;border-radius:19px;padding:5px;box-shadow:0 20px 45px #0007;gap:3px}
  .admin-mobile-nav button{border:0;background:transparent;color:#aaa59c;border-radius:13px;min-height:57px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:8px;font-weight:900;cursor:pointer}
  .admin-mobile-nav button span{font-size:19px;line-height:1}
  .admin-mobile-nav button.active{background:linear-gradient(145deg,#d8b873,#b98f48);color:#111}
  .admin-mobile-nav button.more{color:#e1c37d}
  .admin-more{bottom:78px}
  .top{margin-bottom:8px}
  .shell{padding-bottom:18px}
}

.dashboard-hero{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);
  gap:12px;
  margin:22px 0 13px;
}
.dashboard-welcome{
  position:relative;
  overflow:hidden;
  border:1px solid #c6a15d;
  border-radius:22px;
  padding:25px;
  background:
    radial-gradient(circle at 92% 18%,rgba(198,161,93,.18),transparent 30%),
    linear-gradient(135deg,#0a0a09 0%,#14130f 100%);
  color:#fff;
  box-shadow:0 18px 44px #0002;
}
.dashboard-welcome:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-70px;
  bottom:-100px;
  border:1px solid rgba(225,195,125,.18);
  border-radius:50%;
}
.dashboard-welcome .kicker{color:#d8b873}
.dashboard-welcome h1{
  margin:7px 0 8px;
  font:500 31px Georgia,serif;
  letter-spacing:-.03em;
}
.dashboard-welcome p{
  max-width:650px;
  margin:0;
  color:#aaa49b;
  font-size:10px;
  line-height:1.65;
}
.dashboard-date{
  margin-top:17px;
  padding-top:13px;
  border-top:1px solid #302d27;
  color:#8d887f;
  font-size:9px;
}
.dashboard-date strong{color:#e1c37d;font-weight:800}
.dashboard-health{
  border:1px solid #ddd5c8;
  border-radius:22px;
  padding:21px;
  background:#fffdfa;
}
.dashboard-health-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.dashboard-health h3{
  margin:2px 0 0;
  font:500 19px Georgia,serif;
}
.health-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#6d9b75;
  box-shadow:0 0 0 5px rgba(109,155,117,.1);
}
.health-list{margin-top:15px;display:flex;flex-direction:column;gap:9px}
.health-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding-bottom:9px;
  border-bottom:1px solid #ece6dc;
  font-size:9px;
}
.health-row:last-child{border-bottom:0;padding-bottom:0}
.health-row span{color:#888279}
.health-row strong{color:#34322d}
.health-row .connected{color:#497157}
.health-row .pending{color:#9b783b}
.dashboard-kpis{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:9px;
  margin-bottom:13px;
}
.dashboard-kpi{
  min-height:106px;
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  background:#fffdfa;
}
.dashboard-kpi small{
  display:block;
  color:#8b857c;
  font-size:7px;
  letter-spacing:.11em;
  text-transform:uppercase;
  font-weight:900;
}
.dashboard-kpi strong{
  display:block;
  margin-top:8px;
  font:500 27px Georgia,serif;
  color:var(--ink);
}
.dashboard-kpi span{
  display:block;
  margin-top:4px;
  color:#878078;
  font-size:8px;
}
.dashboard-kpi.accent{
  background:#0a0a09;
  border-color:#b5965d;
}
.dashboard-kpi.accent small{color:#aaa49a}
.dashboard-kpi.accent strong{color:#e1c37d}
.dashboard-kpi.gold{
  background:linear-gradient(145deg,#f4ead6,#fffdfa);
  border-color:#d7bc83;
}
.dashboard-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:12px;
}
.dashboard-section{
  background:#fffdfa;
  border:1px solid var(--line);
  border-radius:19px;
  padding:17px;
}
.dashboard-section .section-title{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.dashboard-section h3{
  margin:2px 0 0;
  font-size:15px;
}
.dashboard-section .section-sub{
  color:#8a8379;
  font-size:8px;
  margin-top:4px;
}
.quick-actions{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}
.quick-action{
  border:1px solid #ded6c9;
  background:#fffdfa;
  border-radius:15px;
  padding:13px;
  cursor:pointer;
  text-align:left;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
}
.quick-action:hover{
  transform:translateY(-2px);
  border-color:#c9a55d;
  background:#fffcf6;
  box-shadow:0 11px 22px #26352c10;
}
.quick-action .qa-icon{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:11px;
  margin-bottom:9px;
  background:#f2eadc;
  color:#806536;
  font-size:16px;
}
.quick-action strong{display:block;font-size:9px;color:#22211e}
.quick-action small{display:block;margin-top:3px;color:#8b857b;font-size:7px;line-height:1.4}
.arrival-list,.departure-list{display:flex;flex-direction:column;gap:7px}
.stay-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #ebe5dc;
}
.stay-row:last-child{border-bottom:0}
.stay-main{min-width:0}
.stay-main strong{
  display:block;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stay-main small{display:block;color:#888078;font-size:8px;margin-top:3px}
.stay-time{
  flex:0 0 auto;
  padding:5px 7px;
  border-radius:99px;
  background:#f2eadb;
  color:#806536;
  font-size:7px;
  font-weight:900;
}
.dashboard-rooms{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}
.dashboard-room{
  padding:11px;
  min-height:89px;
  border-radius:14px;
  border:1px solid #ddd5c8;

<body>
<div id="app"></div>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><div><span id="mk" class="kicker">PMS</span><h2 id="mt">Gestión</h2></div><button class="close" id="mc">Cerrar</button></div><div id="mb"></div></div></div>
<script>
(function(){
var API='https://qdwkmfgjpowsrcpbowdc.supabase.co/functions/v1/oc-auth';
var app=document.getElementById('app'),state={tab:'dashboard',guests:[],rooms:[],orders:[],finance:null,pms:{reservations:[],housekeeping:[],maintenance:[],payments:[]},from:today(),to:addDays(today(),13)};
function token(){try{return localStorage.getItem('oc_admin_token')||''}catch(e){return''}}
function clear(){try{localStorage.removeItem('oc_admin_token')}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function fmtDate(s){if(!s)return '—';return new Date(s+'T12:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'short'})}
function req(path,body,done){var finished=false,x=new XMLHttpRequest();function finish(status,data){if(finished)return;finished=true;done(status,data)}x.open('POST',API+'/'+path,true);x.timeout=12000;x.setRequestHeader('Content-Type','application/json');if(token())x.setRequestHeader('Authorization','Bearer '+token());x.onreadystatechange=function(){if(x.readyState!==4)return;var d={};try{d=JSON.parse(x.responseText||'{}')}catch(e){}finish(x.status,d)};x.onerror=function(){finish(0,{error:'No se pudo conectar con OcaranzaConnect.'})};x.ontimeout=function(){finish(408,{error:'La solicitud tardó demasiado. Revisa tu conexión e inténtalo nuevamente.'})};try{x.send(JSON.stringify(body||{}))}catch(e){finish(0,{error:e.message||'No se pudo enviar la solicitud.'})}}
function modal(title,body,k){document.getElementById('mk').textContent=k||'PMS';document.getElementById('mt').textContent=title;document.getElementById('mb').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('mc').onclick=closeModal;document.getElementById('modal').onclick=function(e){if(e.target===this)closeModal()}
function health(done){var x=new XMLHttpRequest();x.open('GET',API+'/health',true);x.timeout=8000;x.onreadystatechange=function(){if(x.readyState!==4)return;var d={};try{d=JSON.parse(x.responseText||'{}')}catch(e){}done(x.status,d)};x.onerror=function(){done(0,{error:'No se pudo comprobar el estado de la cuenta.'})};x.ontimeout=function(){done(408,{error:'La comprobación tardó demasiado.'})};x.send()}
function setup(){
 app.innerHTML='<div class="shell"><div class="card login"><div style="text-align:center"><span class="logo-h">H</span><span class="logo-word">OCARANZA</span></div><span class="kicker">Primer acceso</span><h1 style="font:500 27px Georgia,serif;margin:6px 0 4px">Activar Centro PMS</h1><p class="muted" style="line-height:1.6">El administrador quedará identificado como <strong>Admin</strong>. Define aquí la contraseña privada que usarás en recepción.</p><form id="sf"><div class="field" style="margin-top:15px"><label>Usuario</label><input value="Admin" readonly></div><div class="field" style="margin-top:10px"><label>Contraseña</label><input id="setup-password" name="password" type="password" required minlength="8" autocomplete="new-password"></div><div class="notice" style="margin-top:10px">Esta contraseña no se guarda en el código del sitio. Se crea directamente en Supabase Auth.</div><button class="btn" style="width:100%;margin-top:14px">Activar administrador</button><div id="se"></div></form></div></div>';
 document.getElementById('sf').onsubmit=function(e){
   e.preventDefault();
   var f=e.target,b=f.querySelector('button.btn'),m=document.getElementById('se');
   b.disabled=true;m.innerHTML='';
   req('signup',{email:'admin@ocaranzaconnect.app',password:f.password.value},function(s,d){
     if(s>=200&&s<300&&d.session){localStorage.setItem('oc_admin_token',d.session.access_token);load();return}
     if(s>=200&&s<300&&d.needsLogin){m.className='notice';m.textContent=d.warning||'Administrador creado. Ahora inicia sesión.';setTimeout(login,700);return}
     b.disabled=false;m.className='error';m.textContent=d.error||'No se pudo activar el administrador.';
   });
 };
}
function login(){app.innerHTML='<div class="shell"><div class="card login"><div style="text-align:center"><span class="logo-h">H</span><span class="logo-word">OCARANZA</span></div><span class="kicker">Gestión interna</span><h1 style="font:500 27px Georgia,serif;margin:6px 0 4px">Centro PMS</h1><p class="muted" style="line-height:1.6">Acceso exclusivo para recepción y administración.</p><form id="lf"><div class="field" style="margin-top:15px"><label>Usuario</label><input name="username" value="Admin" readonly></div><div class="field" style="margin-top:10px"><label>Contraseña</label><div class="login-pass"><input id="admin-password" name="password" type="password" required minlength="8"><button type="button" class="eye-btn" id="toggle-password" aria-label="Mostrar contraseña">◉</button></div></div><button class="btn" style="width:100%;margin-top:14px">Ingresar</button><div id="le"></div></form></div></div>';document.getElementById('toggle-password').onclick=function(){var p=document.getElementById('admin-password');var shown=p.type==='text';p.type=shown?'password':'text';this.textContent=shown?'◉':'◉̸'};document.getElementById('lf').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button.btn'),m=document.getElementById('le');b.disabled=true;req('login',{username:'Admin',password:f.password.value},function(s,d){if(s>=200&&s<300&&d.session){localStorage.setItem('oc_admin_token',d.session.access_token);load()}else{b.disabled=false;m.className='error';m.textContent=d.error||'No se pudo iniciar sesión.'}})}}
function load(){
 if(!token()){
   health(function(s,d){
     if(s>=200&&s<300&&d.adminExists)login();
     else if(s>=200&&s<300&&!d.adminExists)setup();
     else login();
   });
   return;
 }
 app.innerHTML='<div class="shell"><div class="admin-shell"><aside class="admin-sidebar" id="admin-sidebar"><div class="admin-sidebar-brand"><strong>Ocaranza</strong><small>Centro de recepción · PMS</small></div><nav class="side-nav">'+[['dashboard','⌂  Inicio'],['calendar','▦  Calendario'],['reservations','▤  Reservas'],['rooms','▥  Habitaciones'],['guests','♙  Huéspedes'],['operations','⚙  Operación'],['orders','✦  Pedidos'],['finance','$  Caja'],['reports','◫  Reportes'],['settings','⚙  Configuración']].map(function(n){return '<button data-tab="'+n[0]+'">'+n[1]+'</button>'}).join('')+'</nav><div class="side-bottom"><button class="btn light" id="side-refresh" style="width:100%">Actualizar</button><button class="btn" id="side-logout" style="width:100%;margin-top:7px">Salir</button></div></aside><div class="drawer-backdrop" id="drawer-backdrop"></div><main class="admin-main"><header class="top"><div class="brand"><button class="btn light mobile-menu-btn" id="mobile-menu">☰</button><span class="logo-h">H</span><div class="brand-copy"><small>Hotel Ocaranza</small><strong>Recepción</strong></div></div><div class="actions"><button class="btn light" id="refresh-all">Actualizar</button><button class="btn" id="logout">Salir</button></div></header><div id="admin-load-error"></div><div id="views"><div class="admin-loading"><div class="admin-loading-box"><div class="admin-spinner"></div><strong>Cargando Centro PMS</strong><p class="muted">Conectando con los datos de OcaranzaConnect…</p></div></div></div></main></div></div>'; document.getElementById('logout').onclick=function(){clear();closeModal();login()};
 document.getElementById('refresh-all').onclick=function(){load()};
 render();
 var pending=0,failed=[];
 function run(path,body,assign){
   pending++;
   req(path,body,function(s,d){
     pending--;
     if(s===401){clear();login();return}
     if(s>=200&&s<300){assign(d||{});render()}
     else {failed.push(d&&d.error||('Error en '+path));render()}
     if(pending===0&&failed.length&&document.getElementById('views')){var e=document.getElementById('admin-load-error');if(e)e.innerHTML='<strong>Algunos datos no pudieron cargarse.</strong><br>'+esc(failed.join(' · '))+'<br><button class="btn light" id="retry-load" style="margin-top:8px">Reintentar</button>';var rb=document.getElementById('retry-load');if(rb)rb.onclick=load}
   });
 }
 var day=today();
 run('admin-guests',{},function(d){state.guests=d.guests||[];state.rooms=d.rooms||[]});
 run('admin-orders',{},function(d){state.orders=d.orders||[]});
 run('admin-pms',{from:state.from,to:state.to},function(d){state.pms=d||state.pms});
 if(state.tab==='finance')loadFinance();
}

 req('admin-finance',{from:addDays(today(),-30),to:today()},function(s,d){if(s===401){clear();login();return}if(s>=200&&s<300){state.finance=d;render()}else{state.finance={summary:{},days:[]};render()}})
}
function guestModal(id){
 var g=id?state.guests.find(function(x){return x.id===id}):null;
 var roomOptions=state.rooms.map(function(r){return '<option value="'+esc(r.room_number)+'" '+(g&&g.room_number===r.room_number?'selected':'')+'>'+esc(r.room_number)+' · '+r.guest_count+'/'+r.max_occupancy+'</option>'}).join('');
 var body='<form id="gf"><div class="formgrid"><div class="field"><label>Nombre</label><input name="display_name" required value="'+esc(g?g.display_name:'')+'"></div><div class="field"><label>Usuario</label><input name="username" required value="'+esc(g?g.username:'')+'"></div><div class="field"><label>Habitación</label><select name="room_number">'+roomOptions+'</select></div><div class="field"><label>Estado</label><select name="status"><option value="active">Activo</option><option value="checked_out">Check-out</option><option value="blocked">Bloqueado</option></select></div><div class="field"><label>Check-in</label><input type="date" name="check_in" value="'+esc(g?g.check_in:'')+'"></div><div class="field"><label>Check-out</label><input type="date" name="check_out" value="'+esc(g?g.check_out:'')+'"></div><div class="field"><label>Teléfono</label><input name="phone" value="'+esc(g?g.phone:'')+'"></div><div class="field"><label>Notas</label><input name="notes" value="'+esc(g?g.notes:'')+'"></div>'+(!g?'<div class="field full"><label>Contraseña inicial</label><input name="password" type="password" required minlength="6"></div>':'')+'</div><div class="notice" style="margin-top:12px">Las cuentas nuevas quedan activas automáticamente. La contraseña se muestra una sola vez.</div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cancelar</button><button class="btn">Guardar</button></div></form>';
 modal(g?'Editar huésped':'Nuevo huésped',body,'Huéspedes');
 if(g)document.querySelector('#gf select[name=status]').value=g.status;
 document.getElementById('cancel').onclick=closeModal;
 document.getElementById('gf').onsubmit=function(e){

  var bodyData={display_name:f.display_name.value,username:f.username.value,room_number:f.room_number.value,status:f.status.value,check_in:f.check_in.value||null,check_out:f.check_out.value||null,phone:f.phone.value,notes:f.notes.value};
  if(!g)bodyData.password=f.password.value;
  var action=g?'admin-guest-update':'guest-create';
  var payload=g?Object.assign({id:g.id},bodyData):bodyData;
  req(action,payload,function(s,d){
   b.disabled=false;
   if(s<200||s>=300){alert(d.error||'No se pudo guardar.');return}
   if(!g){modal('Cuenta creada','<div class="notice">Usuario: <strong>'+esc(d.profile.username)+'</strong><br>Contraseña: <strong>'+esc(bodyData.password)+'</strong><br><br>Entrégala al huésped de forma segura.</div><div class="toolbar" style="margin-top:14px"><button class="btn" id="done">Entendido</button></div>','Credenciales');document.getElementById('done').onclick=function(){closeModal();load()};return}
   closeModal();load();
  });
 };
}
function passModal(id){
 var g=state.guests.find(function(x){return x.id===id});
 modal('Cambiar contraseña','<form id="pf"><div class="notice">La contraseña actual nunca se muestra. Establece una nueva.</div><div class="field" style="margin-top:12px"><label>Nueva contraseña</label><input name="password" type="password" minlength="6" required></div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cancelar</button><button class="btn">Actualizar</button></div></form>','Seguridad');

 document.getElementById('pf').onsubmit=function(e){e.preventDefault();req('admin-guest-password',{id:id,password:e.target.password.value},function(s,d){if(s>=200&&s<300){closeModal();alert('Contraseña actualizada.')}else alert(d.error||'No se pudo actualizar.')});};

function roomModal(room){var r=state.rooms.find(function(x){return x.room_number===room});modal('Habitación '+room,'<form id="rf"><div class="grid2"><div class="card"><span class="kicker">Ocupación</span><h2 style="font:500 28px Georgia,serif">'+r.guest_count+'/'+r.max_occupancy+'</h2></div><div class="card"><span class="kicker">Housekeeping</span><h2 style="font:500 20px Georgia,serif">'+esc((state.pms.housekeeping.find(function(x){return x.room_number===room})||{}).status||'clean')+'</h2></div></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Capacidad</label><input name="cap" type="number" min="1" max="10" value="'+r.max_occupancy+'"></div><div class="field"><label>Estado</label><select name="status"><option value="available">Disponible</option><option value="maintenance">Mantención</option><option value="blocked">Bloqueada</option></select></div></div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cerrar</button><button class="btn">Guardar</button></div></form>','Habitaciones');document.getElementById('rf').onsubmit=function(e){e.preventDefault();req('admin-room-update',{room_number:room,max_occupancy:e.target.cap.value,status:e.target.status.value},function(s,d){if(s>=200&&s<300){closeModal();load()}else alert(d.error||'No se pudo actualizar.')})};document.getElementById('cancel').onclick=closeModal}
function maintenanceModal(){modal('Nueva incidencia','<form id="mf"><div class="formgrid"><div class="field"><label>Título</label><input name="title" required placeholder="Ej. Fuga en ducha"></div><div class="field"><label>Habitación</label><select name="room_number"><option value="">General</option>'+state.rooms.map(function(r){return '<option>'+esc(r.room_number)+'</option>'}).join('')+'</select></div><div class="field full"><label>Descripción</label><textarea name="description"></textarea></div><div class="field"><label>Prioridad</label><select name="priority"><option>normal</option><option>high</option><option>urgent</option></select></div></div><div class="toolbar" style="margin-top:14px"><button type="button" class="btn light" id="cancel">Cancelar</button><button class="btn">Crear incidencia</button></div></form>','Mantenimiento');document.getElementById('cancel').onclick=closeModal;document.getElementById('mf').onsubmit=function(e){e.preventDefault();var f=e.target;req('admin-pms-maintenance',{op:'create',title:f.title.value,room_number:f.room_number.value||null,description:f.description.value,priority:f.priority.value},function(s,d){if(s>=200&&s<300){closeModal();loadPms()}else alert(d.error||'No se pudo crear.')})}}

 }).join('')||'<div class="empty">No hay salidas programadas para hoy.</div>';

 return '<section class="intro"><div><span class="kicker">Centro PMS · '+dateLabel+'</span><h1>Resumen general</h1><p>La operación del hotel, reunida en una sola pantalla.</p></div></section>'+

}function roomCard(r){var hs=state.pms.housekeeping.find(x=>x.room_number===r.room_number)||{};return '<div class="room '+(r.occupied?'occupied ':'')+(r.status==='maintenance'?'maintenance':'')+'" data-room="'+esc(r.room_number)+'"><strong>'+esc(r.room_number)+'</strong><span class="cap">'+Number(r.guest_count||0)+'/'+Number(r.max_occupancy||2)+'</span><small>Piso '+esc(r.floor)+'</small><span class="state">'+(r.status==='maintenance'?'Mantención':r.status==='blocked'?'Bloqueada':r.occupied?'Ocupada':'Disponible')+'</span><div class="guest">'+(r.guest_count?'Ocupada · '+esc((state.guests.find(g=>g.room_number===r.room_number&&g.status==='active')||{}).display_name||'Huésped'):'Sin huéspedes')+'<br><span class="muted">Housekeeping: '+esc(hs.status||'clean')+'</span></div></div>'}
function calendar(){var days=[];for(var i=0;i<14;i++)days.push(addDays(state.from,i));var res=state.pms.reservations.filter(function(r){return r.status!=='cancelled'&&r.room_number});function dayIndex(date){var d=Math.max(0,Math.ceil((new Date(date+'T12:00:00')-new Date(state.from+'T12:00:00'))/86400000));return Math.min(14,d)}return '<section class="intro"><div><span class="kicker">Planificación</span><h1>Calendario</h1><p>Bloques visuales por habitación y noche. Las reservas se reflejan desde Little Hotelier.</p></div><div><button class="btn light" id="prev14">‹</button> <button class="btn light" id="today14">Hoy</button> <button class="btn light" id="next14">›</button></div></section><div class="calendar-legend"><span class="legend">Verde · Confirmada</span><span class="legend">Negro · Check-in</span><span class="legend">Ocre · Tentativa</span><span class="legend">Haz clic en un bloque para ver detalles</span></div><div class="card calendar-card" style="margin-top:10px"><div class="calendar-wrap"><div class="cal-head-grid"><div class="cal-cell cal-day">Hab.</div>'+days.map(function(d){return '<div class="cal-cell cal-day '+(d===today()?'today':'')+'">'+new Date(d+'T12:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'short'})+'<br>'+new Date(d+'T12:00:00').toLocaleDateString('es-CL',{weekday:'short'})+'</div>'}).join('')+'</div><div class="cal-body">'+state.rooms.map(function(room){var rr=res.filter(function(r){return r.room_number===room.room_number&&r.arrival_date<addDays(state.from,14)&&r.departure_date>state.from});var cells='<div class="cal-cell cal-room">'+esc(room.room_number)+'</div>'+days.map(function(){return '<div class="cal-cell"></div>'}).join('');var blocks=rr.map(function(r){var s=dayIndex(r.arrival_date),e=dayIndex(r.departure_date);if(e<=s)e=Math.min(14,s+1);return '<div class="booking '+esc(r.status)+'" data-reservation-id="'+esc(r.id)+'" style="grid-column:'+(2+s)+' / '+(2+e)+'"><strong>'+esc(r.guest_name)+'</strong><small>'+fmtDate(r.arrival_date)+' → '+fmtDate(r.departure_date)+'</small></div>'}).join('');return '<div class="cal-row">'+cells+blocks+'</div>'}).join('')+'</div></div></div>'}function reservations(){var rows=state.pms.reservations;return '<section class="intro"><div><span class="kicker">Fuente externa</span><h1>Reservas</h1><p>Espejo operativo de las reservas provenientes del PMS principal.</p></div></section><div class="toolbar"><input id="res-search" class="search" placeholder="Buscar huésped, reserva o habitación"><span class="muted">'+rows.length+' reservas reflejadas</span></div><div class="card table-wrap"><table class="table"><thead><tr><th>Reserva</th><th>Huésped</th><th>Habitación</th><th>Estadía</th><th>Canal</th><th>Estado</th><th>Total</th></tr></thead><tbody>'+ (rows.length?rows.map(function(r){return '<tr data-res data-search="'+esc((r.guest_name+' '+r.reservation_code+' '+r.room_number).toLowerCase())+'"><td><strong>'+esc(r.reservation_code||r.external_id||'—')+'</strong><br><span class="muted">'+esc(r.external_source)+'</span></td><td><strong>'+esc(r.guest_name)+'</strong><br><span class="muted">'+esc(r.guest_phone||r.guest_email||'')+'</span></td><td>'+esc(r.room_number||'Sin asignar')+'</td><td>'+fmtDate(r.arrival_date)+' → '+fmtDate(r.departure_date)+'</td><td>'+esc(r.source_channel)+'</td><td><span class="pill '+(r.status==='cancelled'?'red':r.status==='checked_in'?'':'gold')+'">'+esc(r.status)+'</span></td><td>'+money(r.total_amount)+'</td></tr>'}).join(''):'<tr><td colspan="7"><div class="empty"><strong>No hay reservas sincronizadas todavía.</strong><br>El calendario quedará listo para recibir los datos del PMS principal.</div></td></tr>')+'</tbody></table></div>'}

function guests(){return '<section class="intro"><div><span class="kicker">CRM de huéspedes</span><h1>Huéspedes</h1><p>Las cuentas creadas aquí quedan activas por defecto. El historial se conserva al dar de baja.</p></div><button class="btn" id="new-guest">+ Nuevo huésped</button></section><div class="toolbar"><input id="guest-search" class="search" placeholder="Buscar nombre, usuario o habitación"><span class="muted">'+state.guests.length+' registros</span></div><div class="card table-wrap"><table class="table"><thead><tr><th>Huésped</th><th>Habitación</th><th>Estadía</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="guest-body">'+state.guests.map(function(g){return '<tr data-guest data-search="'+esc((g.display_name+' '+g.username+' '+g.room_number).toLowerCase())+'"><td><strong>'+esc(g.display_name)+'</strong><br><span class="muted">@'+esc(g.username)+'</span></td><td>'+esc(g.room_number)+'</td><td>'+fmtDate(g.check_in)+' → '+fmtDate(g.check_out)+'</td><td><span class="pill '+(g.status==='active'?'':g.status==='checked_out'?'gray':'red')+'">'+esc(g.status)+'</span></td><td><button class="btn light edit" data-id="'+esc(g.id)+'">Editar</button> <button class="btn light pass" data-id="'+esc(g.id)+'">Clave</button> <button class="btn danger del" data-id="'+esc(g.id)+'">Baja</button></td></tr>'}).join('')+'</tbody></table></div>'}
function operations(){return '<section class="intro"><div><span class="kicker">Operación</span><h1>Housekeeping y mantenimiento</h1><p>La operación diaria separada del calendario de reservas.</p></div><button class="btn" id="new-maint">+ Incidencia</button></section><div class="grid2"><div class="card"><h3>Housekeeping</h3><p class="muted">Estado de cada habitación.</p><div class="ops-list" style="margin-top:12px">'+state.rooms.map(function(r){var h=state.pms.housekeeping.find(x=>x.room_number===r.room_number)||{status:'clean',priority:'normal'};return '<div class="op"><div><strong>Hab. '+esc(r.room_number)+'</strong><small>'+esc(h.note||'')+'</small></div><select class="select hk" data-room="'+esc(r.room_number)+'"><option value="clean" '+(h.status==='clean'?'selected':'')+'>Limpia</option><option value="dirty" '+(h.status==='dirty'?'selected':'')+'>Sucia</option><option value="cleaning" '+(h.status==='cleaning'?'selected':'')+'>En limpieza</option><option value="inspected" '+(h.status==='inspected'?'selected':'')+'>Inspeccionada</option><option value="out_of_order" '+(h.status==='out_of_order'?'selected':'')+'>Fuera de servicio</option></select></div>'}).join('')+'</div></div><div class="card"><h3>Mantenimiento</h3><div class="ops-list" style="margin-top:12px">'+(state.pms.maintenance.length?state.pms.maintenance.map(function(m){return '<div class="op"><div><strong>'+esc(m.title)+'</strong><small>Hab. '+esc(m.room_number||'general')+' · '+esc(m.priority)+'</small></div><select class="select maint" data-id="'+m.id+'"><option value="open" '+(m.status==='open'?'selected':'')+'>Abierto</option><option value="in_progress" '+(m.status==='in_progress'?'selected':'')+'>En curso</option><option value="resolved" '+(m.status==='resolved'?'selected':'')+'>Resuelto</option><option value="cancelled" '+(m.status==='cancelled'?'selected':'')+'>Cancelado</option></select></div>'}).join(''):'<div class="empty">No hay incidencias registradas.</div>')+'</div></div></div>'}
function orders(){return '<section class="intro"><div><span class="kicker">Guest services</span><h1>Pedidos</h1><p>Solicitudes de huéspedes y consumos operativos.</p></div></section><div class="card"><div class="ops-list">'+(state.orders.length?state.orders.map(function(o){var g=o.oc_guest_profiles||{};return '<div class="op"><div><strong>'+esc(o.item_name)+' · '+money(o.total)+'</strong><small>Hab. '+esc(g.room_number||'—')+' · '+esc(g.display_name||'Huésped')+'</small></div><select class="select order" data-id="'+o.id+'">'+['pending','accepted','preparing','ready','delivered','cancelled'].map(function(s){return '<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'}).join(''):'<div class="empty"><strong>No hay pedidos.</strong></div>')+'</div></div>'}
function finance(){var s=(state.finance||{}).summary||{};return '<section class="intro"><div><span class="kicker">Caja</span><h1>Movimientos</h1><p>Ingresos, pagos y actividad financiera por período.</p></div></section><div class="finance"><div><small>Generado</small><strong>'+money(s.gross)+'</strong></div><div><small>Confirmado</small><strong>'+money(s.confirmed)+'</strong></div><div><small>Cancelado</small><strong>'+money(s.cancelled)+'</strong></div><div><small>Pedidos</small><strong>'+Number(s.orders||0)+'</strong></div><div><small>Movimiento</small><strong>'+money(s.movement)+'</strong></div></div><div class="card" style="margin-top:12px"><div class="toolbar"><strong>Actividad diaria</strong><button class="btn light" id="fin-refresh">Actualizar</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Pedidos</th><th>Generado</th><th>Confirmado</th><th>Cancelado</th><th>Movimiento</th></tr></thead><tbody>'+((state.finance&&state.finance.days)||[]).map(function(d){return '<tr><td>'+esc(d.date)+'</td><td>'+d.orders+'</td><td>'+money(d.gross)+'</td><td>'+money(d.confirmed)+'</td><td>'+money(d.cancelled)+'</td><td>'+money(d.movement)+'</td></tr>'}).join('')+'</tbody></table></div></div>'}

function settings(){return '<section class="intro"><div><span class="kicker">Sistema</span><h1>Configuración</h1><p>La configuración operativa se irá centralizando aquí.</p></div></section><div class="grid2"><div class="card"><h3>Fuente de reservas</h3><p class="muted" style="line-height:1.6">Little Hotelier continúa siendo el sistema de reservas principal. OcaranzaConnect mantiene una copia operativa para visualización y operación.</p><div class="notice" style="margin-top:12px">La integración debe usar un mecanismo autorizado por el proveedor. No almacenaremos credenciales de acceso al PMS externo en el navegador.</div></div><div class="card"><h3>Hotel</h3><p class="muted">10 habitaciones · Ocaranza · Santiago</p><p class="muted">La configuración de capacidad, estados y módulos se administra desde este centro.</p></div></div>'}
function bind(){document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;var s=document.getElementById('admin-sidebar'),bd=document.getElementById('drawer-backdrop');if(s)s.classList.remove('open');if(bd)bd.classList.remove('open');render()}});document.querySelectorAll('[data-mobile-tab]').forEach(function(b){b.onclick=function(){if(b.dataset.mobileTab==='more'){var m=document.getElementById('admin-more');if(m)m.classList.toggle('open');return}state.tab=b.dataset.mobileTab;var m=document.getElementById('admin-more');if(m)m.classList.remove('open');render()}});document.querySelectorAll('[data-more-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.moreTab;var m=document.getElementById('admin-more');if(m)m.classList.remove('open');render()}});document.querySelectorAll('[data-tab-go]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tabGo;render()}});document.querySelectorAll('.booking[data-reservation-id]').forEach(function(b){b.onclick=function(){var r=state.pms.reservations.find(function(x){return String(x.id)===String(b.dataset.reservationId)});if(!r)return;modal('Reserva '+esc(r.reservation_code||r.external_id||''),'<div class="grid2"><div class="card"><span class="kicker">Huésped</span><h3>'+esc(r.guest_name)+'</h3><p class="muted">'+esc(r.guest_phone||r.guest_email||'')+'</p></div><div class="card"><span class="kicker">Habitación</span><h3>'+esc(r.room_number||'Sin asignar')+'</h3><p class="muted">'+fmtDate(r.arrival_date)+' → '+fmtDate(r.departure_date)+'</p></div></div><div class="notice" style="margin-top:12px">Estado: <strong>'+esc(r.status)+'</strong> · Canal: <strong>'+esc(r.source_channel||'—')+'</strong><br>Total: <strong>'+money(r.total_amount)+'</strong></div>','Reserva')}});var ng=document.getElementById('new-guest');if(ng)ng.onclick=function(){guestModal()};var gs=document.getElementById('guest-search');if(gs)gs.oninput=function(){var t=this.value.toLowerCase();document.querySelectorAll('[data-guest]').forEach(function(r){r.style.display=r.dataset.search.indexOf(t)>=0?'':'none'})};document.querySelectorAll('.edit').forEach(function(b){b.onclick=function(){guestModal(b.dataset.id)}});document.querySelectorAll('.pass').forEach(function(b){b.onclick=function(){passModal(b.dataset.id)}});document.querySelectorAll('.del').forEach(function(b){b.onclick=function(){delGuest(b.dataset.id)}});document.querySelectorAll('.room').forEach(function(b){b.onclick=function(){roomModal(b.dataset.room)}});var rs=document.getElementById('res-search');if(rs)rs.oninput=function(){var t=this.value.toLowerCase();document.querySelectorAll('[data-res]').forEach(function(r){r.style.display=r.dataset.search.indexOf(t)>=0?'':'none'})};document.querySelectorAll('.hk').forEach(function(s){s.onchange=function(){req('admin-pms-housekeeping',{room_number:s.dataset.room,status:s.value,priority:'normal'},function(){loadPms()})}});document.querySelectorAll('.maint').forEach(function(s){s.onchange=function(){req('admin-pms-maintenance',{op:'update',id:s.dataset.id,status:s.value},function(){loadPms()})}});document.querySelectorAll('.order').forEach(function(s){s.onchange=function(){req('admin-order-update',{id:s.dataset.id,status:s.value},function(){load()})}});var nm=document.getElementById('new-maint');if(nm)nm.onclick=maintenanceModal;var p=document.getElementById('prev14');if(p)p.onclick=function(){state.from=addDays(state.from,-14);state.to=addDays(state.from,13);loadPms()};var n=document.getElementById('next14');if(n)n.onclick=function(){state.from=addDays(state.from,14);state.to=addDays(state.from,13);loadPms()};var t=document.getElementById('today14');if(t)t.onclick=function(){state.from=today();state.to=addDays(state.from,13);loadPms()};var fr=document.getElementById('fin-refresh');if(fr)fr.onclick=loadFinance;var me=document.getElementById('admin-more');if(me)me.onclick=function(e){if(e.target===me)me.classList.remove('open')};}
load();
})();
